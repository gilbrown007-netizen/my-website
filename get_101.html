/* ================= 6 ================= */
{id:'l6', wk:'Week 5', blk:'mid', title:'Codes of Ethics, Plagiarism, Social Responsibility and Case Studies', short:'Codes, plagiarism, case studies', ch:'Presentation 3 · slides 49–108 · sample paper Q6, Q8–Q13',
 big:'Know the Engineers’ Creed, the six NSPE canons, plagiarism rules, social responsibility pillars and the three case studies.',
 think:{q:'Engineer A suspects Engineer B (a chemical engineer) is not competent to design structural footings. Should A say something?',
  a:'Yes. Canon 2 says engineers perform services only in their area of competence, and canon 1 puts public safety first. Reporting concerns is the ethical response (sample paper Q6).'},
 notes:[
  {t:'What professional codes are', src:'lec', b:`<p>Major religions have brief codes of conduct (Ten Commandments, Five Pillars of Islam, Noble Eightfold Path, and others).</p>${T(['Document','Main purpose'],[['Code of ethics','Sets principles and professional responsibilities'],['Code of conduct','Expresses expectations for behaviour in a role or organisation'],['Engineers’ Creed','States a professional pledge and shared commitments']])}<p>The terms code of ethics and code of conduct can overlap. Codes consist mainly of <b>principles of responsibility</b> that show how to promote the public good.</p>`,
   c:{q:'A pledge stating shared commitments is the',o:['Engineers’ Creed','Code of conduct','Plagiarism policy','Safety sign'],why:'Slide 51.'}},
  {t:'Roles, abuse and limitations of codes', src:'lec', b:`<p><b>Roles:</b> shared standard · guidance and support · education and mutual understanding · accountability · contributing to the profession’s image.</p><p><b>Abuse:</b> deliberate violation (e.g. misusing confidential information) · manipulation of rules (exploiting loopholes) · selective application (applying rules to others but not yourself). A worst abuse is restricting honest moral effort to protect the profession’s image.</p><p><b>Limitations:</b> lack of enforcement · ambiguity · inflexibility · cultural differences · conflict with personal values.</p>${KEY('Roles: 5. Abuse: 3 forms. Limitations: 5.')}`,
   c:{q:'Applying ethics rules to others but not to yourself is',o:['Selective application','Deliberate violation','Ambiguity','Inflexibility'],why:'Slide 54.'}},
  {t:'Nigerian context and the Engineers’ Creed', src:'lec', b:`${T(['Body','Role'],[['COREN','Regulates engineering practice and sets professional requirements'],['NSE','Supports engineers and sets conduct expectations for members'],['NSPE (US)','Its code is the international example studied']])}<p><b>Engineer’s Creed (2021):</b> I dedicate my professional knowledge and skill to the advancement and betterment of <b>human welfare</b>. I pledge: to give the utmost of performance; to participate in none but <b>honest enterprise</b>; to live and work according to the laws of man and the highest standards of professional conduct; to place <b>service before profit</b>, the honour and standing of the profession before personal advantage, and the <b>public welfare above all other considerations</b>. In humility, I make this pledge.</p>`,
   c:{q:'In the Engineers’ Creed, the public welfare is placed',o:['Above all other considerations','After profit','Below personal advantage','Equal to profit'],why:'Slide 58.'}},
  {t:'NSPE Fundamental Canons (six)', src:'lec', b:`<p>Engineers, in fulfilling their duties, shall:</p>${OL(['Hold paramount the <b>safety, health and welfare of the public</b>.','Perform services only in areas of their <b>competence</b>.','Issue public statements only in an <b>objective and truthful</b> manner.','Act for each employer or client as <b>faithful agents or trustees</b>.','Avoid <b>deceptive acts</b>.','Conduct themselves honourably, responsibly, ethically and <b>lawfully</b> to enhance the honour, reputation and usefulness of the profession.'])}${KEY('Mnemonic: Safety · Competence · Truth · Faithful agent · No deception · Honour and law.')}<div class="key"><b>Sample paper Q12:</b> “Engineers may not be required to follow state or federal law when it could compromise the employer’s interests.” <b>False.</b> Canon 6 requires lawful conduct. <b>Q13:</b> expressing technical opinions founded on knowledge of the facts and competence is <b>True</b> (Rule 3).</div>`,
   c:{q:'Which canon says to hold paramount the safety, health and welfare of the public?',o:['Canon 1','Canon 3','Canon 4','Canon 6'],why:'It is the first canon.'}},
  {t:'Rules of practice (appendix): what each canon means in practice', src:'lec', b:`${T(['Canon','Typical rules'],[['1. Public safety','If judgement is overruled in a way that endangers life or property, notify employer/client and other proper authority. Approve only documents that meet standards. Do not reveal confidential information without consent, except as law requires. Do not associate with fraudulent ventures. Report code violations to professional bodies'],['2. Competence','Take assignments only when qualified. Do not sign documents outside your competence or not prepared under your control. You may coordinate and seal an entire project only if each technical segment is sealed by the qualified engineer who prepared it'],['3. Truthful statements','Be objective and truthful in reports and testimony; include all relevant information; date reports. Disclose the interested party if a statement is paid for or inspired by them'],['4. Faithful agent','Disclose conflicts of interest. No compensation from more than one party on the same project unless disclosed and agreed. No outside payments for work you are responsible for. Public-service engineers do not take part in decisions about services their own organisation provides'],['5. No deception','Do not falsify or exaggerate qualifications or past responsibility. Do not give, offer or accept contributions to influence awards of public contracts. No gifts or commissions to secure work except to bona fide employees or agencies']])}<p><span class="badge b-smp">sample paper Q6</span> Engineer A <b>does</b> have an ethical duty to question Engineer B’s competence and report to the contractor, because B (a chemical engineer) has no established foundation-design training.</p>`,
   c:{q:'An engineer should sign and seal plans only for work',o:['Within their competence and prepared under their direction','Prepared by anyone','Outside their field if the client agrees','That they have not seen'],why:'Rule 2.'}},
  {t:'Plagiarism: definition and who punishes it', src:'lec', b:`<p><b>Plagiarism</b> is wrongful appropriation or stealing of another author’s language, thoughts, ideas or expressions and presenting them as your own. It is academic dishonesty and a breach of journalistic ethics. Penalties include suspension and expulsion.</p><p>Plagiarism is <b>not itself a crime</b> (it can constitute copyright infringement). It is <b>defined and punished by institutions</b>: professional associations, educational institutions, commercial entities, publishing companies.</p>${T(['Issue','Main concern'],[['Plagiarism','Misrepresenting source or authorship (using another’s paragraph as yours)'],['Copyright infringement','Rights over protected uses of a work; may need authorisation even when the author is named']])}<div class="key"><b>Sample paper Q8:</b> institutions responsible for punishing plagiarism: academic bodies, commercial entities, publishers, <b>except the court of law</b>.</div>`,
   c:{q:'Which does NOT punish all forms of plagiarism?',o:['The court of law','Academic institutions','Commercial entities','Publishing bodies'],why:'Plagiarism is not itself defined or punished by law.'}},
  {t:'Forms of plagiarism and paraphrasing', src:'lec', b:`<p>Turnitin lists 10 forms. In short:</p>${OL(['Submitting someone’s work as your own','Reusing your own earlier work without citing','Rewriting someone’s work without citing','Using quotations without citing','Interweaving sources without citing','Citing some but not all passages that need citation','Melding cited and uncited sections','Proper citation but wording and structure too close to the source','Inaccurate citation','Relying too heavily on others’ work with no original thought'])}<p><b>Paraphrase test:</b> use new wording and new structure, and acknowledge the source. A citation alone does not fix close copying.</p><div class="key"><b>Sample paper Q9:</b> reading other works to draw insights before writing yours does <b>not</b> constitute plagiarism. Using quotations without citing, citing only some passages, or rewriting without citing <b>do</b>.</div>`,
   c:{q:'Which is NOT plagiarism?',o:['Reading other works for insight before writing yours','Quoting without citing','Citing only some passages that need citing','Rewriting someone’s work without citing'],why:'Sample paper Q9.'}},
  {t:'Social responsibility', src:'lec', b:`<p><b>Social responsibility</b> is the ethical obligation of individuals, organisations or governments to act for the benefit of society as a whole, not just their own interests. A trade-off may exist between economic development and welfare of society and environment; it means sustaining the balance.</p>${UL(['Applies to <b>everyone</b> whose actions affect the environment, not only businesses.','Can be <b>passive</b> (avoid harmful acts) or <b>active</b> (advance social goals).','Must be <b>intergenerational</b>.'])}${T(['Actor','Examples'],[['Individuals','Act honestly, use resources responsibly'],['Organisations','Provide safe work, reduce harm, treat stakeholders fairly'],['Government','Develop and enforce public-interest policies'],['Engineering professionals','Apply competence and judgement to protect people and environment']])}${T(['Pillar','Meaning'],[['Environmental','Reduce pollution, conserve resources, promote sustainability'],['Ethical','Fairness and integrity; respect workers’ rights, fair wages, transparency'],['Economic','Promote fairness, avoid exploitation, long-term value'],['Legal','Comply with laws: the <b>minimum standard</b>']])}<p>Practice example: a company funds a community borehole but its operations release contaminants into nearby water. Both support and harm must be examined.</p><div class="key"><b>Sample paper Q10:</b> it is <b>untrue</b> that social responsibility is the sole responsibility of corporate bodies. <b>Q11:</b> an ethical model of responsible action should address individuals, organisations and <b>governments</b>.</div>`,
   c:{q:'Which statement about social responsibility is untrue?',o:['It is the sole responsibility of corporate bodies','It balances economy and ecosystem','It is every individual’s responsibility','It can be active or passive'],why:'Sample paper Q10.'}},
  {t:'Case study 1: Space Shuttle Challenger (1986)', src:'lec', b:`${UL(['<b>28 January 1986</b>: exploded 73 seconds after liftoff, killing all 7 astronauts, including teacher Christa McAuliffe.','<b>Cause:</b> O-ring seal failure in the solid rocket boosters. Launch temperature about −1 °C made them brittle.','Engineers at Morton Thiokol (Roger Boisjoly and team) warned NASA not to launch. NASA management overruled them because of schedule pressure and public expectations.','<b>Ethical issues:</b> public safety neglected, expert warnings ignored, engineers’ duty to act when safety is compromised.','<b>Aftermath:</b> Rogers Commission found technical failure and communication breakdown. Shuttle flights suspended nearly 3 years; boosters redesigned; better reporting channels and ethics training.','Boisjoly testified publicly and became a symbol of professional courage, despite backlash.'])}${KEY('Lessons: safety first · speak up · communicate openly · technical facts must guide, not be overruled by management or politics.')}`,
   c:{q:'The immediate technical cause of the Challenger disaster was',o:['O-ring seal failure made brittle by cold','Engine failure from fuel shortage','Pilot error','Lightning strike'],why:'Slide 75.'}},
  {t:'Case study 2: Niger Delta oil spills', src:'lec', b:`${UL(['Thousands of spills over decades from poor maintenance, pipeline corrosion, sabotage and negligence. Shell Petroleum Development Company (SPDC) and other multinationals are most notable.','Destroyed farmland, fisheries and water sources; health and livelihood crises.','<b>Ethical issues:</b> environmental responsibility, human rights, transparency (allegations of falsified spill-cause data), justice and accountability (Ogoni and Bodo cases).','<b>Resolutions:</b> 2021 Dutch court ordered Shell to compensate Nigerian farmers and improve pipeline monitoring; HYPREP began Ogoniland clean-up (slow); weak enforcement remains.'])}<p><b>Lesson:</b> technical competence without moral responsibility leads to long-term harm; ethical engineering protects people and planet.</p>`,
   c:{q:'The agency that began clean-up in Ogoniland is',o:['HYPREP','COREN','NSE','NISET'],why:'Hydrocarbon Pollution Remediation Project.'}},
  {t:'Case study 3: the “I LOVE YOU” virus (2000)', src:'lec', b:`${UL(['May 2000: worm spread by email with subject “I LOVE YOU” and attachment LOVE-LETTER-FOR-YOU.txt.vbs.','Origin traced to the Philippines; main suspect Onel de Guzman, a student. The Philippines had no law against computer crime, so he could not be prosecuted for hacking.','It overwrote files, stole passwords and sent itself to all contacts. Millions of computers infected; estimated damages <b>$5–10 billion</b>.','<b>Ethical issues:</b> intent vs consequence (no malicious intent does not remove responsibility for foreseeable harm), privacy and trust, accountability across borders, need for cyber ethics and regulation.','<b>Aftermath:</b> Philippine E-Commerce Act (2000) criminalised malicious online acts; ethical hacking and responsible coding advocated.'])}${KEY('“Can I?” must always be followed by “Should I?”')}`,
   c:{q:'The main ethical lesson of the “I LOVE YOU” virus is',o:['Technical skill carries moral responsibility','Email is unsafe','Students should not code','Laws are unnecessary'],why:'“Can I?” then “Should I?”.'}}
 ],
 examples:[
  {t:'Sample paper Q6 reasoning', q:'Why does Engineer A have a duty to report concerns about Engineer B?', steps:['B is a chemical engineer with no shown foundation-design training.','Canon 2: perform services only within competence.','Canon 1: public safety is paramount; weak footings endanger people.','So A should raise concerns with the contractor.'],ans:'Yes: competence and public safety justify reporting.'},
  {t:'Is it plagiarism?', q:'A student copies a paragraph, changes four words and adds a citation. Is it acceptable?', steps:['Wording and structure are still too close to the source.','A citation alone does not make a good paraphrase.','Rewrite in your own words and structure and cite.'],ans:'No: too close; paraphrase properly.'},
  {t:'Compare Challenger and Niger Delta', q:'State one shared ethical issue and one difference.', steps:['Shared: harm happened because safety and responsibility were neglected, and warnings or standards were not respected.','Difference: Challenger was a single sudden event with 7 deaths; Niger Delta is decades of environmental harm to communities.'],ans:'Both show duty to protect people. One was acute, the other chronic.'}

{id:'l7', wk:'Final · SDGs', blk:'fin', title:'Sustainability and the Sustainable Development Goals (SDGs)', short:'Sustainability & SDGs', ch:'Presentation 4 · all slides',
 big:'Define sustainability, know the three dimensions and five Ps, and learn all 17 goals with an engineering example for each.',
 think:{q:'A town wants a new office block. Before designing it, what is the first sustainability question to ask?',
  a:'Whether the project is necessary at all. Perhaps more efficient use of existing buildings is better. Sustainability is not bolted on at the end; it starts with the first decision.'},
 notes:[
  {t:'What is sustainability?', src:'lec', b:`<p><b>Sustainability</b> is the challenge of meeting human needs (natural resources, industrial products, energy, food, transportation, shelter, effective waste management) while conserving and protecting environmental quality and the natural resource base essential for future development.</p><p>Short definition: <b>“meeting the needs of the present without compromising the ability of future generations to do the same.”</b> It is fundamentally about people, includes future generations, and affects us now.</p><p><span class="badge b-ext">extra</span> This is the Brundtland definition from <i>Our Common Future</i> (World Commission on Environment and Development, 1987), listed in your references.</p>${KEY('Meet present needs without compromising future generations.')}`,
   c:{q:'Sustainability means',o:['Meeting present needs without compromising future generations','Maximising profit now','Stopping all development','Using resources freely'],why:'Slide 5.'}},
  {t:'Three dimensions and systems thinking', src:'lec', b:`${UL(['“Environmental” and “sustainability” are not identical: sustainability also has <b>social and economic</b> dimensions. All three must be balanced.','Society needs a supportive environment; the economy needs a stable society.','Sustainability <b>cannot be bolted on at the end</b> of a design. A first question may be whether the project is even necessary.','Solutions need <b>systems thinking</b>: recognise relationships between systems. Example: the fossil-fuel energy system raised living standards but contributes to climate change and to inequality between those with and without energy.','Complex links also create <b>opportunities</b>: sustainable energy helps cut emissions, reduce energy poverty and reduce resource conflict.'])}`,
   c:{q:'Which are the three dimensions of sustainability?',o:['Environmental, social and economic','Political, legal and military','Technical, artistic and moral','Local, national and global'],why:'All three must be balanced.'}},
  {t:'What the SDGs are: core elements, five Ps, coverage, interconnection', src:'lec', b:`<p>The <b>Sustainable Development Goals</b> are 17 goals for people and planet. <span class="badge b-ext">extra</span> They were adopted by the UN General Assembly in 2015 as part of the <b>2030 Agenda</b> (A/RES/70/1) with 169 targets, to be achieved by 2030.</p><p><b>Three core elements</b> (slide 12 is a diagram): economic growth, social inclusion and environmental protection.</p><p><b>Five Ps</b> (slide 13 is a diagram): <b>People, Planet, Prosperity, Peace, Partnership</b>.</p>${UL(['<b>Coverage / universality:</b> no one should be left behind, especially the most marginalised (e.g. Goal 1 No Poverty, Goal 10 Reduced Inequalities).','<b>Interconnectivity:</b> goals are interconnected and indivisible. Example: Goal 3 (health) depends on Goal 6 (clean water and sanitation).','<b>Innovation, infrastructure and nation building:</b> Goal 9 supports resilient infrastructure and innovation; Goal 16 supports strong institutions, peace, justice and accountability.'])}${KEY('Five Ps: People · Planet · Prosperity · Peace · Partnership.')}`,
   c:{q:'The Five Ps of the SDGs are',o:['People, Planet, Prosperity, Peace, Partnership','Power, Profit, Politics, Place, People','Plan, Prepare, Protect, Produce, Promote','Poverty, Pollution, Population, Policy, Peace'],why:'UN 2030 Agenda.'}},
  {t:'The 17 goals (Goals 1–9)', src:'lec', b:`${T(['Goal','Slide example'],[['1 No Poverty','Financial help or jobs so no one lacks food, shelter, clothing'],['2 Zero Hunger','Support local farmers, school meals, reduce food waste'],['3 Good Health and Well-being','Affordable healthcare, vaccines, healthy lifestyles'],['4 Quality Education','Free accessible education, rural schools, adult education'],['5 Gender Equality','Equal pay, women’s rights, equal access for girls'],['6 Clean Water and Sanitation','Rural water systems, toilets for all, protect rivers and lakes'],['7 Affordable and Clean Energy','Solar and wind, affordable electricity, less fossil dependence'],['8 Decent Work and Economic Growth','Fair-wage safe jobs, small business support, innovation'],['9 Industry, Innovation and Infrastructure','Roads and railways, clean technologies, new industries']])}<p><span class="badge b-ext">extra</span> <b>Engineering links:</b> 6 water treatment (civil/chemical) · 7 solar and grid design (electrical) · 9 resilient infrastructure (civil, all) · 3 medical devices (biomedical).</p>`,
   c:{q:'Goal 7 is',o:['Affordable and Clean Energy','Clean Water and Sanitation','Climate Action','Zero Hunger'],why:'Goal 6 is water; goal 13 is climate.'}},
  {t:'The 17 goals (Goals 10–17)', src:'lec', b:`${T(['Goal','Slide example'],[['10 Reduced Inequalities','Raise minimum wages, access to education in disadvantaged areas, include marginalised groups'],['11 Sustainable Cities and Communities','Affordable housing, green spaces, safe public transport'],['12 Responsible Consumption and Production','Recycling, using fewer resources, eco-friendly products'],['13 Climate Action','Cut carbon emissions, renewables, efficiency, prepare for floods and heatwaves'],['14 Life Below Water','Reduce plastic pollution, sustainable fishing, marine protected areas'],['15 Life on Land','Plant trees, protect endangered species, land use that keeps habitats'],['16 Peace, Justice and Strong Institutions','Fair trial, effective law enforcement, transparent accountable government'],['17 Partnerships for the Goals','Governments, businesses and non-profits fund projects, share knowledge, cooperate across borders']])}${KEY('Water → 6 (clean) and 14 (below). Land → 15. Cities → 11. Climate → 13. Partnerships → 17 (last).')}<p class="mini">Slide typos: the deck title reads “SGDS” and Goal 9 is spelled “Infrstructure”. The correct forms are SDGs and Infrastructure.</p>`,
   c:{q:'Which goal is “Peace, Justice and Strong Institutions”?',o:['Goal 16','Goal 17','Goal 10','Goal 9'],why:'Goal 17 is partnerships.'}},
  {t:'Quick grouping to memorise the goals', src:'ext', b:`<p>Group the 17 goals to remember them:</p>${T(['Theme','Goals'],[['People','1 No Poverty · 2 Zero Hunger · 3 Health · 4 Education · 5 Gender Equality'],['Planet','6 Water · 12 Consumption · 13 Climate · 14 Life Below Water · 15 Life on Land'],['Prosperity','7 Energy · 8 Work and Growth · 9 Industry · 10 Inequalities · 11 Cities'],['Peace','16 Peace, Justice, Institutions'],['Partnership','17 Partnerships']])}<p class="mini">Grouping follows the UN “Five Ps” idea; the UN lists goal 6 under Planet in this common grouping.</p>`,
   c:{q:'Goal 17 corresponds to which P?',o:['Partnership','People','Planet','Prosperity'],why:'Partnerships for the Goals.'}}
 ],

{id:'l8', wk:'Final · Safety', blk:'fin', title:'Safety and Risk Analysis in Engineering Practice', short:'Safety & risk analysis', ch:'Presentation 5 · all slides',
 big:'Hazard vs risk, sources of risk, hierarchy of controls, PPE, safety signs, and the 3 × 3 risk matrix (risk = likelihood × severity).',
 think:{q:'A loose cable lies across a busy workshop walkway. Is the cable the hazard or the risk?',
  a:'The cable is the hazard (it can cause harm). The risk is how likely someone is to trip and how serious the injury could be.'},
 notes:[
  {t:'Safety, hazard, risk and control', src:'lec', b:`<p><b>Safety</b> means preventing injury, ill health and other unacceptable harm. Decisions affect workers, users, the public and the environment. Think about safety through design, construction, operation and maintenance. Professional responsibility includes speaking up about serious hazards.</p>${T(['Term','Meaning','Workshop example'],[['Hazard','Something with the potential to cause harm','A loose cable across a walkway'],['Risk','How likely harm is and how serious it could be','A person may trip and be injured'],['Control','Action that removes or reduces risk','Keep cables off the route or use cable protection']])}${KEY('Hazard = what could cause harm. Risk = how likely and how serious.')}`,
   c:{q:'Risk is',o:['How likely harm is and how serious it could be','Anything that can cause harm','An action reducing harm','A safety sign'],why:'The hazard is what can cause harm.'}},
  {t:'Sources of risk', src:'lec', b:`${T(['Source','Example'],[['Technical','A design error or unsuitable material causes failure'],['Human and organisational','Poor training, fatigue or weak communication'],['Operational','Missed maintenance leaves equipment unsafe'],['Digital','A software fault or cyberattack disrupts a safety function']])}<p><b>Wider context:</b></p>${T(['Context','Example'],[['Environment','Flooding reaches electrical equipment'],['Suppliers','A part arrives with the wrong specification'],['Cost and schedule','Pressure encourages skipped inspections'],['Governance','Unclear responsibilities leave hazards unresolved']])}<p>Several sources can combine in one incident. Cost and schedule pressure still require responsible safety decisions (compare Challenger).</p>`,
   c:{q:'Fatigue and poor training are examples of which risk source?',o:['Human and organisational','Technical','Digital','Supplier'],why:'Slide 5.'}},
  {t:'Health, safety and environment (HSE) and the hierarchy of controls', src:'lec', b:`${T(['Focus','Protects','Example'],[['Health','Physical and mental well-being','Control long-term exposure to noise, dust or workload'],['Safety','People from injury at work','Guard moving machinery'],['Environment','Air, water, land, ecosystems','Contain spills, manage waste']])}<p><b>Hierarchy of controls</b> (most to least preferred):</p>${T(['Rank','Control','Example'],[['1','Elimination','Assemble at ground level to avoid work at height'],['2','Substitution','Choose a less hazardous cleaning product'],['3','Engineering controls','Install a machine guard'],['4','Administrative controls','Training, procedures, access rules'],['5','PPE','Task-appropriate eye protection']])}${KEY('Eliminate · Substitute · Engineer · Administer · PPE. PPE is the last line, not the first.')}<p>Prefer controls that rely less on individual behaviour.</p>`,
   c:{q:'Which control is most preferred in the hierarchy?',o:['Elimination','PPE','Administrative controls','Substitution'],why:'Removing the hazard is best.'}},
  {t:'PPE: personal protective equipment', src:'lec', b:`<p>PPE is equipment worn to help protect the body. Check fit, condition and compatibility with other PPE. Train users in its limits and correct use. Choose the right type for the job.</p>${T(['Hazard','Possible PPE','Key point'],[['Flying particles','Suitable eye protection, face shield where needed','A face shield may supplement eye protection'],['Dust or fumes','Suitable respiratory protection','Select for the contaminant; check fit and training'],['Noise','Earplugs or earmuffs','Correct selection and fit'],['Impact or contact','Helmet, gloves, footwear','Check compatibility and entanglement risk']])}<div class="warn">A cloth or surgical mask does <b>not</b> give equivalent protection to a suitable respirator.</div>`,
   c:{q:'Which statement about PPE is correct?',o:['A cloth mask is not equivalent to a suitable respirator','PPE is the best control','PPE needs no training','Any glove fits every task'],why:'Slide 10.'}},
  {t:'Safety signs: five groups', src:'lec', b:`${T(['Group','Appearance','Meaning'],[['Prohibition','Red circle with diagonal bar','Do not'],['Warning','Yellow triangle','Watch out: hazard present'],['Mandatory action','Blue circle','You must'],['Safe condition','Green square or rectangle','Help, exit, first aid'],['Fire equipment','Red square or rectangle','Location of firefighting equipment']])}<p>Read the symbol, any supporting text and the colour. Signs do not remove the hazard; physical controls may still be needed.</p>${KEY('Red circle = prohibited. Yellow triangle = warning. Blue circle = mandatory. Green = safe. Red square = fire equipment.')}`,
   c:{q:'A blue circle sign means',o:['A mandatory action','A prohibition','A warning','Fire equipment'],why:'Blue circle = you must.'}},
  {t:'The risk management process', src:'lec', b:`${OL(['<b>Identify</b> hazards and who may be harmed.','<b>Assess</b> likelihood and possible severity.','<b>Choose and implement</b> controls.','<b>Record</b> actions, responsibilities and deadlines.','<b>Review</b> and update.'])}<p><b>Finding hazards:</b> observe normal and infrequent work (cleaning, maintenance), ask workers, check records, consider visitors, describe how someone could be harmed.</p><p><b>Scenario parts:</b> cause/condition → people exposed → unwanted event → consequence.</p>${EG('Cable across walkway → students and technicians → someone trips → injury needing treatment.')}`,
   c:{q:'Which is the first step of the risk management process?',o:['Identify hazards and who may be harmed','Review controls','Record actions','Choose controls'],why:'Start by identifying hazards.'}},
  {t:'Risk assessment tools', src:'lec', b:`${T(['Tool','Main question'],[['Risk matrix','How should we prioritise risks using likelihood and severity?'],['FMEA','How could a component fail, and what would happen?'],['Fault tree analysis','What combinations of causes could lead to a failure?'],['HAZOP','What deviations from intended process operation could create hazards?']])}<p>This course applies a simple risk matrix.</p>`,
   c:{q:'Which tool asks “how could a component fail, and what would happen?”',o:['FMEA','HAZOP','Fault tree','Risk matrix'],why:'Failure Mode and Effects Analysis.'}},
  {t:'The 3 × 3 risk matrix', src:'lec', b:`<p><b>Risk score = Likelihood (L) × Severity (S).</b></p>${T(['Score','Likelihood','Severity'],[['1','Unlikely: harm not expected','Minor: first aid only'],['2','Possible: harm could occur','Moderate: treatment or time off'],['3','Likely: harm expected unless conditions change','Severe: fatal or life-changing']])}${T(['L \\ S','S1 Minor','S2 Moderate','S3 Severe'],[['3 Likely','3 Medium','6 High','9 High'],['2 Possible','2 Low','4 Medium','6 High'],['1 Unlikely','1 Low','2 Low','3 Medium']])}<p><b>Actions:</b> High = control before work. Medium = review controls. Low = maintain and monitor.</p><p><b>Worked example:</b> loose cable, L = 3, S = 2 → 3 × 2 = <b>6 (High)</b>. After secured cable protection: L = 1, S = 2 → <b>2 (Low)</b>. Severity stays 2 because an injury, if it happened, would be the same.</p><p><b>Class activity:</b> bench grinder with a missing guard, L = 2, S = 3 → 6 (High). Strong control: remove it from use until a guard is fitted (elimination/engineering control). PPE alone cannot fix a missing guard.</p>${KEY('Bands: 1–2 Low · 3–4 Medium · 6–9 High. Scores are ordered categories, not measured probabilities; a low score does not prove safety.')}`,

  {t:'What a risk matrix can and cannot tell you; recording and review', src:'lec', b:`${UL(['Helps compare risks using stated assumptions.','Scores are <b>ordered categories</b>, not measured probabilities.','The same score can come from different L and S combinations.','Severe consequences, uncertainty and required controls still need <b>judgement</b>.','Record hazard, ratings, controls and reasons; assign an <b>action owner and date</b>.','Check controls in practice; learn from incidents and near misses; <b>review after changes</b> or control failures.'])}<p>Cable example: the technician checks the route before each session and after layout changes.</p>`,

    b.onclick=()=>{
      if(host.classList.contains('locked'))return;host.classList.add('locked');
      if(o.ok)b.classList.add('right');else{b.classList.add('wrong');box.children[opts.findIndex(x=>x.ok)].classList.add('right')}
      const w=document.createElement('div');w.className='why';w.innerHTML=`<b>${o.ok?'Correct.':'Not quite.'}</b> ${c.why}`;host.appendChild(w);
    };
    box.appendChild(b);
  });
}

/* ---------- quiz widget: untimed = instant feedback; timed = exam mode graded on submit/time-out ---------- */
let activeTimer=null;
function stopTimer(){if(activeTimer){clearInterval(activeTimer);activeTimer=null}document.querySelectorAll('.timer').forEach(b=>{if(!document.getElementById('view').contains(b))b.remove()})}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const lessonNo=id=>LESSONS.findIndex(l=>l.id===id)+1;
function statusOf(p){return p>=80?['Strong','st-good']:p>=60?['Fair','st-mid']:['Needs work','st-bad']}
function quiz(host,qs,key,label,opts){
  opts=opts||{};stopTimer();
  const timed=!!opts.seconds;
  let answered=0,right=0,done=false,endAt=0,sure=false,sureTO=null;
  const t0=Date.now(),cards=[];
  host.innerHTML='';
  let bar=null,sb=null;
  const resetSure=()=>{sure=false;clearTimeout(sureTO);if(sb&&!done)sb.textContent='Submit now'};
  if(timed){
    bar=document.createElement('div');bar.className='timer';
    bar.innerHTML=`<div><span class="tl">Time left</span><b class="tv">${fmt(opts.seconds)}</b><span class="tc">0 / ${qs.length} answered</span></div><button class="btn" type="button">Submit now</button>`;
    host.appendChild(bar);
    const sp=document.createElement('div');sp.className='timer-sp';host.appendChild(sp);
    requestAnimationFrame(()=>{sp.style.setProperty('--tsp',bar.offsetHeight+'px')});
    sb=bar.querySelector('button');
    sb.onclick=()=>{
      const un=qs.length-answered;
      if(un&&!sure){sure=true;sb.textContent=`Tap again to submit (${un} unanswered)`;clearTimeout(sureTO);sureTO=setTimeout(resetSure,5000);return}
      grade(false);
    };
  }
  const wrap=document.createElement('div');wrap.className='stack';host.appendChild(wrap);
  const result=document.createElement('div');result.style.marginTop='12px';host.appendChild(result);
  shuffle(qs).forEach((q,n)=>{
    const os=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
    const card=document.createElement('div');card.className='q';
    card.innerHTML=`<div class="qn">Question ${n+1} of ${qs.length}${q.lid?` · Lesson ${lessonNo(q.lid)}`:''}</div><p class="qt">${q.q}</p><div class="opts"></div>`;
    const box=card.querySelector('.opts'),st={card,box,os,q,sel:-1,ok:false};cards.push(st);
    os.forEach((o,i)=>{
      const b=document.createElement('button');b.className='opt';b.type='button';
      b.innerHTML=`<span class="l">${'ABCD'[i]}</span><span>${o.t}</span>`;
      b.onclick=()=>{
        if(timed){
          if(done)return;
          if(st.sel<0)answered++;
          st.sel=i;[...box.children].forEach((c,j)=>c.classList.toggle('sel',j===i));
          bar.querySelector('.tc').textContent=`${answered} / ${qs.length} answered`;
          resetSure();return;
        }
        if(card.classList.contains('locked'))return;card.classList.add('locked');answered++;st.sel=i;
        if(o.ok){right++;st.ok=true;card.classList.add('ok');b.classList.add('right')}else{b.classList.add('wrong');box.children[os.findIndex(x=>x.ok)].classList.add('right')}
        const w=document.createElement('div');w.className='why';w.innerHTML=`<b>${o.ok?'Correct.':'Not quite.'}</b> ${q.why}`;card.appendChild(w);
        if(answered===qs.length)grade(false);
      };
      box.appendChild(b);
    });
    wrap.appendChild(card);
  });
  function grade(timeout){
    if(done)return;done=true;stopTimer();clearTimeout(sureTO);
    const usedSec=Math.min(timed?opts.seconds:1e9,Math.round((Date.now()-t0)/1000));
    if(timed){
      right=0;
      cards.forEach(c=>{
        c.card.classList.add('locked');
        const ci=c.os.findIndex(x=>x.ok);
        [...c.box.children].forEach(x=>x.classList.remove('sel'));
        c.box.children[ci].classList.add('right');
        let head;
        if(c.sel===ci){right++;c.ok=true;c.card.classList.add('ok');head='Correct.'}
        else if(c.sel<0){head='Unanswered.'}
        else{c.box.children[c.sel].classList.add('wrong');head='Not quite.'}
        const w=document.createElement('div');w.className='why';w.innerHTML=`<b>${head}</b> ${c.q.why}`;c.card.appendChild(w);
      });
      sb.disabled=true;sb.textContent='Submitted';bar.classList.remove('low','crit');
    }
    const N=qs.length,pct=Math.round(100*right/N),unans=N-answered,wrongN=answered-right;
    let best=null;
    if(key){best=Math.max(pct,mem[key]||0);save(key,best);paintNav()}
    if(opts.mode){save('hist',(mem.hist||[]).concat([{t:Date.now(),mode:opts.mode,n:N,r:right,p:pct,s:usedSec,timed}]).slice(-30))}
    const by={};cards.forEach(c=>{const k=c.q.lid;if(!k)return;by[k]=by[k]||[0,0];by[k][1]++;if(c.ok)by[k][0]++});
    const lids=Object.keys(by).sort((x,y)=>by[x][0]/by[x][1]-by[y][0]/by[y][1]||lessonNo(x)-lessonNo(y));
    const weak=lids.filter(k=>100*by[k][0]/by[k][1]<70);
    const missed=cards.filter(c=>!c.ok).map(c=>c.q);
    const msg=pct>=80?'Solid. Revisit anything you missed.':pct>=50?'Getting there. Re-read the lessons below, then retry the questions you missed.':'Go back through the lessons below and the worked examples, then retry.';
    const tile=(k,v)=>`<div class="tile"><div class="qn">${k}</div><div class="tv2">${v}</div></div>`;
    const rows=lids.map(k=>{const p=Math.round(100*by[k][0]/by[k][1]),st=statusOf(p);
      return `<tr><td><a href="#${k}">${lessonNo(k)}. ${LESSONS.find(l=>l.id===k).short}</a></td><td>${by[k][0]} / ${by[k][1]}</td><td style="min-width:90px"><div class="pbar"><span style="width:${p}%"></span></div></td><td>${p}%</td><td><span class="st ${st[1]}">${st[0]}</span></td></tr>`}).join('');
    result.innerHTML=`<div class="card an">
      <div class="qn">${label}${timeout?' · time’s up, auto-graded':''}</div><div class="big" style="font:600 26px var(--f-mono);margin:4px 0">${right} / ${N} · ${pct}%</div><div>${msg}</div>
      <div class="tiles">${tile('Correct',right)}${tile('Wrong',wrongN)}${tile('Unanswered',unans)}${tile('Time used',fmt(usedSec)+(timed?' / '+fmt(opts.seconds):''))}${tile('Avg / question',Math.round(usedSec/N)+' s')}${best!=null?tile('Best score',best+'%'):''}</div>
      ${rows?`<h3 style="margin:14px 0 6px">Results by lesson (weakest first)</h3><div class="tw"><table><tr><th>Lesson</th><th>Score</th><th>Bar</th><th>%</th><th>Status</th></tr>${rows}</table></div>`:''}
      ${weak.length?`<p style="margin:12px 0 0"><b>Focus next:</b> ${weak.slice(0,4).map(k=>`<a href="#${k}">Lesson ${lessonNo(k)}</a>`).join(' · ')}</p>`:(rows?`<p style="margin:12px 0 0"><b>No lesson below 70%.</b> Try a longer set.</p>`:'')}
      <div class="actions"><button class="btn" type="button" id="again">New set</button>${missed.length?`<button class="btn alt" type="button" id="miss">Retry the ${missed.length} missed</button>`:''}${wrongN+unans>0?`<button class="btn alt" type="button" id="onlywrong">Show only wrong answers</button>`:''}</div></div>`;
    result.querySelector('#again').onclick=()=>{if(opts.again)opts.again();else{quiz(host,qs,key,label,opts)}host.scrollIntoView({behavior:'smooth',block:'start'})};
    const mb=result.querySelector('#miss');if(mb)mb.onclick=()=>{quiz(host,missed.slice(),null,'Retry of missed questions',{again:opts.again});host.scrollIntoView({behavior:'smooth',block:'start'})};
    const ow=result.querySelector('#onlywrong');if(ow)ow.onclick=()=>{const on=wrap.classList.toggle('onlywrong');ow.textContent=on?'Show all questions':'Show only wrong answers'};
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  if(timed){
    endAt=Date.now()+opts.seconds*1000;
    const tv=bar.querySelector('.tv');
    activeTimer=setInterval(()=>{
      const left=(endAt-Date.now())/1000;
      tv.textContent=fmt(left);
      bar.classList.toggle('low',left<=60&&left>15);bar.classList.toggle('crit',left<=15);
      if(left<=0)grade(true);
    },250);
  }
}

/* ---------- builder for Mock exam and Practice bank ---------- */
const RATES=[[0,'Timer off · instant feedback'],[90,'Relaxed · 90 s/question'],[60,'Standard · 60 s/question'],[40,'Tight · 40 s/question']];
const MIDIDS=MID.map(l=>l.id),FINIDS=FIN.map(l=>l.id),ALLIDS=LESSONS.map(l=>l.id);
const SIZES=[10,20,40,60,0];
function poolFor(ids){return LESSONS.filter(l=>ids.includes(l.id)).flatMap(l=>[...l.quiz,...l.more].map(q=>({...q,lid:l.id}))).concat(SAMPLE.filter(s=>ids.includes(s.lid)))}
function builder(mode,rerender){
  const p=mode==='exam'?'e':'p';
  const dfLs=mode==='exam'?MIDIDS:ALLIDS,dfRate=mode==='exam'?60:0,dfN=mode==='exam'?20:10;
  const ids=(Array.isArray(mem[p+'ls'])&&mem[p+'ls'].length?mem[p+'ls']:dfLs).filter(i=>ALLIDS.includes(i));
  const pool=poolFor(ids);
  const n=Number.isInteger(mem[p+'n'])&&mem[p+'n']>=0?mem[p+'n']:dfN;
  const rate=RATES.some(r=>r[0]===mem[p+'rate'])?mem[p+'rate']:dfRate;
  const count=pool.length?(n?Math.min(n,pool.length):pool.length):0;
  const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
  const pre=[['Midterm (lessons 1–6)',MIDIDS],['Final (lessons 7–8)',FINIDS],['Whole course',ALLIDS]];
  const ctl=(label,h)=>`<div class="ctl"><div class="qn">${label}</div>${h}</div>`;
  const hist=(mem.hist||[]).filter(h=>h.mode===mode).slice(-5).reverse();
  const html=
   ctl('Number of questions',`<div class="sw" id="sn">${SIZES.map(s=>`<button type="button" data-n="${s}" aria-pressed="${n===s}">${s||'All'}</button>`).join('')}<input id="cn" type="number" min="1" max="500" placeholder="Custom" value="${SIZES.includes(n)?'':n}" aria-label="Custom number of questions" style="width:90px"></div>`)+
   ctl('Lessons',`<div class="sw">${pre.map((x,i)=>`<button type="button" data-p="${i}" aria-pressed="${same(ids,x[1])}">${x[0]}</button>`).join('')}</div><div class="sw lsw" id="lsw" style="margin-top:6px">${LESSONS.map((l,i)=>`<button type="button" data-w="${l.id}" aria-pressed="${ids.includes(l.id)}" title="${l.title}">${i+1}. ${l.short} · ${poolFor([l.id]).length}</button>`).join('')}</div>`)+
   ctl('Timer',`<div class="sw" id="sr">${RATES.map(r=>`<button type="button" data-r="${r[0]}" aria-pressed="${r[0]===rate}">${r[1]}</button>`).join('')}</div>`)+
   `<p class="mini" style="margin:8px 0 0">${pool.length} questions in your selection (including sample-paper questions)${count&&count<pool.length?`, ${count} drawn at random`:''}.${rate&&count?` Time allowed: <b>${fmt(count*rate)}</b>.`:''}</p>`+
   (hist.length?`<div class="card" style="margin-top:12px"><div class="qn">Your recent ${mode==='exam'?'exams':'practice sets'}</div><div class="tw"><table><tr><th>When</th><th>Questions</th><th>Score</th><th>Time</th><th>Mode</th></tr>${hist.map(h=>`<tr><td>${new Date(h.t).toLocaleDateString(undefined,{day:'numeric',month:'short'})} ${new Date(h.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${h.n}</td><td><b>${h.r}/${h.n}</b> · ${h.p}%</td><td>${fmt(h.s)}</td><td>${h.timed?'Timed':'Untimed'}</td></tr>`).join('')}</table></div></div>`:'')+
   `<div id="qz" style="margin-top:14px"></div>`;
  return {html,
   bind(){
    const $=s=>view.querySelector(s);
    $('#sn').querySelectorAll('button').forEach(b=>b.onclick=()=>{save(p+'n',+b.dataset.n);rerender()});
    $('#cn').onchange=e=>{const v=parseInt(e.target.value,10);if(v>0){save(p+'n',v);rerender()}};
    view.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{save(p+'ls',pre[+b.dataset.p][1]);rerender()});
    $('#lsw').querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=b.dataset.w;save(p+'ls',ids.includes(w)?ids.filter(x=>x!==w):ids.concat(w));rerender()});
    $('#sr').querySelectorAll('button').forEach(b=>b.onclick=()=>{save(p+'rate',+b.dataset.r);rerender()});
   },
   run(label,key){
    const host=view.querySelector('#qz');
    if(!pool.length){host.innerHTML='<div class="warn">Select at least one lesson to build a set.</div>';return}
    const qs=shuffle(pool).slice(0,count);
    if(!rate){quiz(host,qs,key,label,{mode,again:rerender});return}
    const secs=qs.length*rate;
    host.innerHTML=`<div class="card"><div class="qn">Timed set</div><p style="margin:4px 0 10px"><b>${qs.length} questions · ${fmt(secs)}</b>. Pick an answer for each question (you can change it). Nothing is marked until you press Submit or time runs out; then everything is graded automatically. Unanswered questions count as wrong.</p><button class="btn" type="button" id="go">Start the timer</button></div>`;
    host.querySelector('#go').onclick=()=>{quiz(host,qs,key,label,{seconds:secs,mode,again:rerender});host.scrollIntoView({behavior:'smooth',block:'start'})};
   }};
}
function exam(){
  const bd=builder('exam',exam);
  view.innerHTML=`<div class="kicker">Revise</div><h1>Mock exam</h1><p class="lede">Choose how many questions, which lessons and whether to run it under a timer. With the timer on, it is graded automatically on submit or time-out, with an analysis by lesson.</p>${bd.html}`;
  bd.bind();bd.run('Mock exam','q_exam');
}
function practice(topic){
  if(topic&&ALLIDS.includes(topic))save('pls',[topic]);
  const bd=builder('practice',()=>practice());
  view.innerHTML=`<div class="kicker">Revise</div><h1>Practice bank</h1><p class="lede">Pick lessons and a set size. With the timer off, every answer is marked at once. With it on, you get exam conditions.</p>${bd.html}`;
  bd.bind();bd.run('Practice set','qp_all');
}
function samplePage(){
  view.innerHTML=`<div class="kicker">Revise</div><h1>Sample midterm paper</h1><p class="lede">Your 15-question GET 101 sample sheet (2023/2024, Level 100). Choose how to take it.</p>
  <div class="ctl"><div class="qn">Mode</div><div class="sw" id="sm"><button type="button" data-m="0">Instant feedback</button><button type="button" data-m="1">Timed · 15 minutes</button><button type="button" data-m="2">Timed · 30 minutes</button></div></div>
  <p class="mini">Questions are shuffled and each question is tagged to its lesson, so results show which lessons to revisit. The sample sheet had no answer key; the answers are from your lecture slides (Q3 is the one to double-check with your lecturer).</p>
  <div id="qz" style="margin-top:14px"></div>`;
  const host=view.querySelector('#qz');
  const go=m=>{const qs=SAMPLE.slice();quiz(host,qs,'q_sample','Sample paper',m?{seconds:m===1?900:1800,mode:'sample',again:()=>go(m)}:{mode:'sample',again:()=>go(0)})};
  view.querySelectorAll('#sm button').forEach(b=>b.onclick=()=>{view.querySelectorAll('#sm button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));go(+b.dataset.m)});
}

function route(){
  stopTimer();const h=location.hash.slice(1),r=ROUTES.includes(h)?h:'home';
  save('last',r);
  if(r==='home')home();else if(r==='files')files();else if(r==='summary')summary();else if(r==='exam')exam();else if(r==='sample')samplePage();
  else if(r.startsWith('practice'))practice(r.slice(9));else lesson(LESSONS.findIndex(l=>l.id===r));
  paintNav();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
if(!location.hash&&mem.last&&mem.last!=='home'&&ROUTES.includes(mem.last)){location.hash=mem.last}else{route()}
</script>
</body></html>
