<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GET 101 Study App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#14202B; --muted:#5A6B7A; --line:#D9E1E8;
  --ember:#C2410C; --ember-soft:#FDEBDD; --steel:#0B6E8A; --steel-soft:#E1F1F6;
  --good:#15803D; --good-soft:#DDF3E4; --bad:#B42318; --bad-soft:#FBE4E1; --code:#EEF2F5;
  --f-head:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151C; --surface:#152028; --ink:#E5ECF1; --muted:#93A4B2; --line:#27363F;
  --ember:#FF9A5C; --ember-soft:#3A2417; --steel:#52C2DE; --steel-soft:#12303A;
  --good:#4ADE80; --good-soft:#143323; --bad:#FF8A80; --bad-soft:#3B1B19; --code:#1C2A33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151C; --surface:#152028; --ink:#E5ECF1; --muted:#93A4B2; --line:#27363F;
  --ember:#FF9A5C; --ember-soft:#3A2417; --steel:#52C2DE; --steel-soft:#12303A;
  --good:#4ADE80; --good-soft:#143323; --bad:#FF8A80; --bad-soft:#3B1B19; --code:#1C2A33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);margin:8px;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--steel)}
.shell{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
nav.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.brand{font:700 13px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--ember);margin-bottom:10px}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
nav.rail button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.35;color:var(--ink)}
nav.rail button:hover{background:var(--line)}
nav.rail button[aria-current="page"]{background:var(--steel-soft);color:var(--steel);font-weight:600}
nav.rail button:focus-visible,.btn:focus-visible,.opt:focus-visible,summary:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.done{background:var(--good);border-color:var(--good)}
main{min-width:0}
.kicker{font:600 12px var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
h1{font-size:clamp(28px,5vw,40px);margin:6px 0 10px}
h2{font-size:22px;margin:36px 0 12px}
h3{font-size:17px}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:8px;padding:14px 16px;min-width:0}
.note h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.note p{margin:6px 0}.note ul,.note ol{margin:6px 0;padding-left:20px}
.badge{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.b-lec{background:var(--steel-soft);color:var(--steel)}
.b-ext{background:var(--ember-soft);color:var(--ember)}
.b-smp{background:var(--good-soft);color:var(--good)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:8px 0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-block;padding:9px 16px;border-radius:7px;background:var(--steel);color:var(--bg);font:600 14px var(--f-body)}
.btn.alt{background:transparent;color:var(--steel);border:1.5px solid var(--steel)}
.btn:disabled{opacity:.5;cursor:default}
.think{background:var(--steel-soft);border-radius:10px;padding:14px 18px}
.think p{margin:4px 0 10px}
details.ex{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.ex summary{cursor:pointer;font-weight:600;list-style:none}
details.ex summary::before{content:"▸ ";color:var(--ember)}
details.ex[open] summary::before{content:"▾ "}
details.ex .body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
details.ex ol{margin:6px 0;padding-left:20px}
.ans{font-weight:600;color:var(--good);margin-top:6px}
.mist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.mist li{background:var(--bad-soft);border-radius:8px;padding:10px 14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.qn{font:600 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qt{margin:4px 0 12px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.opt:hover{border-color:var(--steel)}
.opt .l{font:600 13px var(--f-head);color:var(--muted);flex:none;width:18px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--steel);background:var(--steel-soft)}
.q.locked .opt{cursor:default}
.why{margin-top:12px;padding:10px 12px;background:var(--code);border-radius:8px;font-size:15px}
.big{font:700 34px var(--f-head)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:32px}
.topbar{max-width:1080px;margin:0 auto 16px;display:flex;justify-content:flex-end}
.tick{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--muted);cursor:pointer}
.tick input{width:16px;height:16px;accent-color:var(--ember);margin:0}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.pbar span{display:block;height:100%;background:var(--good)}
.best{margin:0;color:var(--muted);font-size:14px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;max-width:100%}
.ctl+.ctl{margin-top:8px}
.chk{margin-top:12px;padding:12px 14px;background:var(--steel-soft);border-radius:8px}
.chk .qn{color:var(--steel)}
.chk .qt{margin:2px 0 8px;font-weight:500}
.chk .opt{background:var(--surface);padding:8px 10px}
.chk .why{background:var(--surface);margin-top:8px;font-size:14.5px}
.chk.locked .opt{cursor:default}
.warn{border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 14px;margin:8px 0}
.key{border-left:4px solid var(--ember);background:var(--ember-soft);border-radius:8px;padding:8px 12px;margin:8px 0}
.eg{border-left:4px solid var(--good);background:var(--good-soft);border-radius:8px;padding:8px 12px;margin:8px 0}
.yes{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.mix{color:var(--ember);font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mini{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--code);font-size:12.5px;color:var(--muted)}
.blk{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-left:6px}
.blk.mid{background:var(--steel-soft);color:var(--steel)}.blk.fin{background:var(--ember-soft);color:var(--ember)}
.sw{display:flex;flex-wrap:wrap;gap:2px;max-width:100%;border:1.5px solid var(--line);border-radius:18px;padding:2px;background:var(--surface)}
.sw button{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 14px;border-radius:99px;font:600 13px var(--f-body);color:var(--muted);white-space:normal;text-align:center}
.sw button[aria-pressed="true"]{background:var(--steel);color:var(--bg)}
.sw button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.sw input{all:unset;box-sizing:border-box;padding:4px 10px;font:600 13px var(--f-body);color:var(--ink);min-width:0}
.lsw button{font-size:12.5px}
.timer{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(1040px,calc(100% - 24px));box-sizing:border-box;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--steel);border-radius:10px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.timer .tl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:10px}
.timer .tv{font:600 26px var(--f-mono);color:var(--steel)}
.timer .tc{margin-left:14px;font-size:13.5px;color:var(--muted)}
.timer.low{border-color:var(--ember)}.timer.low .tv{color:var(--ember)}
.timer.crit{border-color:var(--bad);background:var(--bad-soft)}.timer.crit .tv{color:var(--bad)}
.timer-sp{height:var(--tsp,64px);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--code);border-radius:8px;padding:8px 10px}.tile .tv2{font:600 20px var(--f-mono)}
.st{font:600 11px var(--f-body);padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-good{background:var(--good-soft);color:var(--good)}.st-mid{background:var(--ember-soft);color:var(--ember)}.st-bad{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.onlywrong .q.ok{display:none}
.an table td{vertical-align:middle}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.wd label{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.wd select{padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:14px var(--f-body)}
.mx{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;margin-top:10px;font-size:13.5px}
.mx div{padding:8px;border-radius:6px;text-align:center;background:var(--code)}
.mx .hd{background:transparent;color:var(--muted);font-weight:600}
.mx .Low{background:var(--good-soft);color:var(--good)}.mx .Medium{background:var(--ember-soft);color:var(--ember)}.mx .High{background:var(--bad-soft);color:var(--bad)}
.mx .on{outline:3px solid var(--ink);font-weight:700}
.sdg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:8px 0}
.sdg span{background:var(--code);border-radius:6px;padding:6px 8px;font-size:13px}
.sdg b{color:var(--steel)}
html,body{overflow-x:clip}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;align-items:center}
  .brand,.nav-group{display:none}
  nav.rail button{flex:none;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
  nav.rail button .full{display:none}
}
@media (min-width:861px){nav.rail button .short{display:none}}
</style>

<body>
<div class="topbar">
  <div class="sw" id="themeSw" role="group" aria-label="Colour theme">
    <button type="button" data-t="system" aria-pressed="true">Auto</button>
    <button type="button" data-t="light" aria-pressed="false">Light</button>
    <button type="button" data-t="dark" aria-pressed="false">Dark</button>
  </div>
</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Lessons"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<script>
const B = {lec:['From your lecture slides','b-lec'], ext:['Beyond your slides','b-ext'], smp:['Sample paper','b-smp']};
const T = (h,rows) => `<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const UL = a => `<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const OL = a => `<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
const KEY = s => `<div class="key"><b>Write this down:</b> ${s}</div>`;
const EG = s => `<div class="eg"><b>Example:</b> ${s}</div>`;
const LESSONS = [];
/* In each quiz item, o[0] is the correct option; options are shuffled on screen. */
LESSONS.push(
/* ================= 1 ================= */
{id:'l1', wk:'Week 1', blk:'mid', title:'History of Engineering and Technological Innovations', short:'History & innovations', ch:'Presentation 1 · slides 2–13 and 46–51',
 big:'Engineering is as old as the wheel. Know the three eras, who invented what, and when.',
 think:{q:'The Great Pyramid of Giza was built about 4,500 years ago, with no engines or cranes. What kinds of tools could have made it possible?',
  a:'Simple machines. Your slides say the pyramids were built with three of the six: the inclined plane (ramp), the wedge and the lever. Engineering did not start with electricity; it started with ramps, levers and wheels.'},
 notes:[
  {t:'Where the word “engineer” comes from', src:'lec', b:`<p>The word <b>engineer</b> comes from the Latin <b>ingeniare</b> (“to create, generate, contrive, devise”) and <b>ingenium</b> (“cleverness”). So an engineer is, at root, a clever creator.</p><p>Engineering has existed since ancient times. Early inventions include the <b>wheel, wedge, lever and pulley</b>.</p>${KEY('Engineering history has <b>three periods</b>: Ancient Era, Middle Ages, Modern Era.')}`,
   c:{q:'The word “engineer” comes from the Latin words',o:['ingeniare and ingenium','machina and fabrica','scientia and ars','ingredi and mensura'],why:'Ingeniare = to create or devise; ingenium = cleverness.'}},
  {t:'Ancient Era: the six classic simple machines', src:'lec', b:`<p>Six simple machines were developed in the Ancient Era. Learn the order and place:</p>${T(['Machine','Where and when'],[['Wedge','Prehistoric times'],['Inclined plane (ramp)','Prehistoric times'],['Wheel and axle','Mesopotamia (modern Iraq), 5th millennium BC'],['Lever','About 5000 years ago. First a simple balance scale, later used to move large objects in ancient Egypt'],['Pulley','Mesopotamia (early 2nd millennium BC); ancient Egypt (1991–1802 BC)'],['Screw','Mesopotamia (911–609 BC). <b>The last simple machine to be invented</b>']])}${KEY('Mesopotamia = wheel, pulley, screw. Prehistoric = wedge and inclined plane. Screw = last.')}`,
   c:{q:'Which simple machine was the last of the six to be invented?',o:['The screw','The wheel and axle','The wedge','The lever'],why:'The screw first appeared in Mesopotamia (911–609 BC).'}},
  {t:'What a simple machine does and the pyramids', src:'lec', b:`<p>The Egyptian pyramids were built using <b>three</b> of the six simple machines: the <b>inclined plane, the wedge and the lever</b>. They made it possible to raise and place huge blocks such as those in the Great Pyramid of Giza.</p><p><span class="badge b-ext">extra</span> A <b>simple machine</b> is a device with no or few moving parts that changes the size or direction of a force, so a small effort can move a large load. The idea is called <b>mechanical advantage</b>: a longer ramp needs less force but a longer distance.</p>${EG('Pushing a 100 kg block up a long ramp needs far less force than lifting it straight up, but you push it a longer distance.')}`,
   c:{q:'Which three simple machines were used to build the Egyptian pyramids?',o:['Inclined plane, wedge and lever','Wheel, screw and pulley','Pulley, screw and wedge','Lever, wheel and screw'],why:'Slide 7 names the inclined plane, the wedge and the lever.'}},
  {t:'Middle Ages', src:'lec', b:`${UL(['<b>Windmill and wind pump:</b> the earliest practical wind-powered machines. They appeared in the Muslim world during the Islamic Golden Age (now Iran, Afghanistan, Pakistan) by the <b>9th century AD</b>.','<b>Cotton gin:</b> invented in India by the <b>6th century AD</b>.','<b>Spinning wheel:</b> invented in the Islamic world by the early <b>11th century</b>.','The earliest <b>programmable machines</b> were developed in the Muslim world.'])}<div class="warn"><b>Do not mix up:</b> the slide on innovations also lists “the cotton gin, 1793”. That is Eli Whitney’s mechanical cotton gin. The Middle Ages entry (6th century, India) is the earlier roller type.</div>`,
   c:{q:'The earliest practical wind-powered machines appeared by the 9th century in',o:['The Muslim world (Iran, Afghanistan, Pakistan)','Ancient Egypt','Industrial Britain','Ancient Greece'],why:'Slide 8: windmill and wind pump, Islamic Golden Age.'}},
  {t:'Modern Era I: mechanics, civil engineering, machine tools', src:'lec', b:`${UL(['<b>Classical (Newtonian) mechanics</b> formed the scientific basis of much of modern engineering.','<b>Canal building</b> was important engineering work in the early Industrial Revolution.','<b>John Smeaton</b> was the first self-proclaimed civil engineer and is regarded as the <b>“father” of civil engineering</b>. He designed bridges, canals, harbours and lighthouses.','Applied science led to the <b>steam engine</b> (slide 48 dates it 1712).','<b>John Wilkinson</b> invented the boring machine, considered the <b>first machine tool</b>. It made precise boring of cast iron cylinders possible.','Other machine tools: screw-cutting lathe, milling machine, turret lathe, metal planer.','Precision machining (first half of 19th century) gave <b>interchangeable parts</b>, which led to large-scale factory production by the late 19th century.'])}${KEY('Smeaton = civil engineering. Wilkinson = first machine tool (boring machine). Interchangeable parts = mass production.')}`,
   c:{q:'Who is regarded as the “father” of civil engineering?',o:['John Smeaton','John Wilkinson','James Maxwell','Michael Faraday'],why:'Smeaton was the first self-proclaimed civil engineer.'}},
  {t:'Modern Era II: electrical and electronics engineering', src:'lec', b:`${UL(['Foundations in the 1800s: experiments of <b>Alessandro Volta, Michael Faraday, Georg Ohm</b> and others.','The electric telegraph (slide: 1816) and electric motor (slide: 1872).','Theoretical work of <b>James Maxwell and Heinrich Hertz</b> (late 19th century) gave rise to <b>electronics</b>.','The <b>vacuum tube</b> and the <b>transistor</b> accelerated electronics so much that electrical and electronics engineers now outnumber engineers of any other specialty.'])}<div class="warn"><b>Date check:</b> slide 49 lists the telegraph as 1837, while slide 11 says 1816. Early experimental telegraphs existed from the 1810s, and the practical telegraph came in the 1830s. Quote the slide’s date for the question that uses it, and know the telegraph was a 19th-century invention.</div>`,
   c:{q:'Which pair of scientists’ theoretical work gave rise to electronics?',o:['James Maxwell and Heinrich Hertz','Volta and Ohm','Smeaton and Wilkinson','Wright and Faraday'],why:'Maxwell and Hertz, late 19th century.'}},
  {t:'Modern Era III: chemical and aeronautical/aerospace', src:'lec', b:`${UL(['<b>Chemical engineering</b> developed in the late 19th century. Industrial-scale manufacturing needed new materials and processes. By <b>1880</b> chemicals were being made at large scale in industrial plants. Slide example: the <b>Dangote refinery</b>.','<b>Aeronautical engineering</b> deals with aircraft design. <b>Aerospace engineering</b> is the modern term that also includes <b>spacecraft</b> design.','Only a decade after the <b>Wright brothers’</b> first flight (1903), military aircraft were developed for <b>World War I</b>. Slide example: a Boeing 737 airliner.'])}`,
   c:{q:'What does aerospace engineering add to aeronautical engineering?',o:['Spacecraft design','Ship design','Bridge design','Software design'],why:'Aeronautical = aircraft. Aerospace = aircraft and spacecraft.'}},
  {t:'Technological innovation: definition and recent examples', src:'lec', b:`<p>A <b>technological innovation</b> is the creation and application of new or improved technologies, tools, systems and processes that bring significant advancements or breakthroughs. It uses knowledge, expertise and resources to solve problems, improve efficiency, drive progress and deliver value.</p><p><b>Recent examples on your slide:</b> (a) World Wide Web (b) mobile technology and smartphones (c) cloud computing (d) artificial intelligence (e) 3D printing (f) renewable energy technologies (g) biotechnology and genetic engineering (h) Internet of Things (IoT).</p><p><span class="badge b-ext">extra</span> <b>Invention</b> = a new idea or device. <b>Innovation</b> = an idea put into use that delivers value. The printing press was an invention; the printing industry that spread books was the innovation.</p>`,
   c:{q:'Which of these is NOT on the slide’s list of recent technological innovations?',o:['The printing press','Cloud computing','Internet of Things','3D printing'],why:'The printing press (1430s) is a historic innovation, not a recent one.'}},
  {t:'Innovations that changed society: the timeline', src:'lec', b:`<p>Slides 47–51 list many innovations with dates. You do not need all, but learn the order of the big ones and the groupings.</p>${T(['Period','Innovations (from the slides)'],[['Before 1 AD','Sailboat (4th millennium BC) · abacus, lever (3rd millennium BC) · nail (2nd millennium BC) · cement, alphabetisation (1st millennium BC) · Archimedes’ screw (3rd century BC)'],['1 AD – 1500','Paper (2nd century) · gunpowder (10th) · paper money (11th) · compass (12th) · optical lenses (13th) · mechanised clock (15th) · printing press (1430s)'],['1500 – 1800','Gregorian calendar 1582 · steam engine 1712 · sextant 1757 · vaccination 1796 · cotton gin 1793 · moldboard plow (18th)'],['1800 – 1900','Photography (early 19th) · telegraph 1837 · anesthesia 1846 · industrial steelmaking 1850 · refrigeration 1850s · oil drilling 1859 · pasteurisation 1863 · telephone 1876 · steam turbine 1884 · electricity and internal combustion engine (late 19th)'],['1900 – 1950','Airplane 1903 · air-conditioning 1902 · radio 1906 · assembly line 1913 · nitrogen fixation 1918 · scientific plant breeding 1920s · rocketry 1926 · penicillin 1928 · combine harvester 1930s · nuclear fission 1939'],['After 1950','Semiconductor electronics and green revolution (mid-20th) · the pill 1960 · the Internet 1960s · personal computer 1970s']])}${KEY('Anchor dates: printing press 1430s → steam engine 1712 → telephone 1876 → airplane 1903 → penicillin 1928 → Internet 1960s.')}<p class="mini">Source of the list: Fallows (2013), “The 50 greatest breakthroughs since the wheel”, The Atlantic.</p>`,
   c:{q:'Which innovation is the oldest?',o:['The sailboat (4th millennium BC)','The compass (12th century)','Paper (2nd century)','The abacus (3rd millennium BC)'],why:'4th millennium BC is earlier than the 3rd.'}},
  {t:'Class activity: build the tallest free-standing tower', src:'lec', b:`<p>Task: build the tallest <b>free-standing</b> tower using <b>only the provided newspaper and tape</b>.</p><p><span class="badge b-ext">extra</span> This is a miniature of the engineering design process: define the problem (tallest, free-standing), set <b>constraints</b> (only newspaper and tape, time limit), generate ideas, build a prototype, test, redesign. A wide base and rolled newspaper tubes (a strong shape) usually work best.</p>`,
   c:{q:'In the tower activity, “only newspaper and tape” is an example of a',o:['Constraint','Hypothesis','Prototype','Innovation'],why:'A constraint limits what you may use.'}}
 ],
 examples:[
  {t:'Placing inventions in the right era', q:'Place each in Ancient Era, Middle Ages or Modern Era: (a) lever (b) spinning wheel (c) Wilkinson’s boring machine (d) screw (e) windmill.', steps:['Ancient: the six simple machines, so lever and screw.','Middle Ages: windmill (9th century), spinning wheel (11th century).','Modern: boring machine, the first machine tool (Industrial Revolution).'],ans:'(a) Ancient (b) Middle Ages (c) Modern (d) Ancient (e) Middle Ages.'},
  {t:'Explain how the pyramids were possible', q:'In four lines, explain how simple machines helped build the Great Pyramid.', steps:['Name the three: inclined plane, wedge, lever.','Ramps (inclined plane) let blocks be dragged up with less force.','Levers lifted and positioned heavy blocks.','Wedges split stone and fixed blocks in place.'],ans:'Simple machines cut the force needed, so people with no engines could build huge structures.'},
  {t:'Chain of cause: how electronics arose', q:'Link Faraday, Maxwell and the transistor in one chain.', steps:['1800s: Volta, Faraday and Ohm’s experiments laid the foundations of electrical engineering.','Late 1800s: Maxwell and Hertz’s theory gave rise to electronics.','Later: the vacuum tube and the transistor accelerated electronics.'],ans:'Experiments → theory → devices. That is why electrical and electronics engineers are the largest group.'}
 ],
 mist:['Saying the screw was invented first. It was the <b>last</b> of the six simple machines.','Mixing Smeaton (civil engineering) with Wilkinson (first machine tool).','Calling the printing press a “recent” innovation.','Mixing the two cotton gins: India 6th century and Whitney 1793.','Writing that aerospace is only about aircraft. It includes spacecraft too.'],
 quiz:[
  {q:'How many main periods is engineering history divided into on your slides?',o:['Three','Two','Four','Six'],why:'Ancient Era, Middle Ages, Modern Era.'},
  {q:'The wheel and axle first appeared in',o:['Mesopotamia, 5th millennium BC','Egypt, 1991 BC','India, 6th century AD','Britain, 1712'],why:'Slide 6.'},
  {q:'John Wilkinson’s boring machine is considered',o:['The first machine tool','The first steam engine','The first lathe','The first telegraph'],why:'It allowed precise boring of cast iron cylinders.'},
  {q:'Interchangeable parts led to',o:['Large-scale factory production','The invention of the wheel','Wind power','The Gregorian calendar'],why:'Late 19th century factories.'},
  {q:'The Wright brothers’ flight was followed within about a decade by',o:['Military aircraft in World War I','The first spacecraft','The jet engine','The Internet'],why:'Slide 13.'}
 ],
 more:[
  {q:'The earliest programmable machines were developed in',o:['The Muslim world','Industrial Britain','Ancient Egypt','Modern Japan'],why:'Slide 8.'},
  {q:'Which scientists are named as foundations of electrical engineering?',o:['Volta, Faraday and Ohm','Smeaton and Wilkinson','Newton and Galileo','Wright and Edison'],why:'Slide 11.'},
  {q:'Chemical engineering developed in the',o:['Late 19th century','Ancient Era','15th century','Mid-20th century'],why:'Industrial-scale chemicals by 1880.'},
  {q:'A technological innovation is best described as',o:['The creation and application of new or improved technologies that solve problems and deliver value','Any old tool','A scientific theory with no use','A government policy'],why:'Definition on slide 46.'},
  {q:'Which came first?',o:['Printing press','Steam engine','Telephone','Airplane'],why:'1430s, 1712, 1876, 1903.'},
  {q:'The lever was first used as',o:['A simple balance scale','A cutting tool','A water pump','A sail'],why:'Later it moved large objects in ancient Egypt.'},
  {q:'The Dangote refinery is used on the slides as an example of',o:['Chemical engineering','Civil engineering','Aerospace engineering','Software engineering'],why:'Slide 12.'},
  {q:'The spinning wheel was invented in the Islamic world by the early',o:['11th century','6th century','19th century','2nd century'],why:'Slide 8.'},
  {q:'Which innovation on your slides dates from the 1960s?',o:['The Internet and the pill','The telephone','The airplane','The steam engine'],why:'Slides 47–49.'},
  {q:'Penicillin dates from',o:['1928','1796','1903','1960'],why:'Slide 47.'},
  {q:'An invention becomes an innovation when',o:['It is put to use and delivers value','It is patented only','It is forgotten','It is copied exactly'],why:'Use and value distinguish innovation.'},
  {q:'Which machine tools are named on slide 10?',o:['Screw-cutting lathe, milling machine, turret lathe, metal planer','Hammer and saw','Pulley and lever','Steam turbine and engine'],why:'Slide 10.'}
 ]},

/* ================= 2 ================= */
{id:'l2', wk:'Weeks 1–2', blk:'mid', title:'What Is Engineering? Engineers, Disciplines and the Design Process', short:'What is engineering?', ch:'Presentation 1 · slides 14–45 · sample paper Q1, Q3, Q4, Q5',
 big:'Engineers use science and math to solve real-world problems. Know how engineering differs from science and technology, and the steps of the design process.',
 think:{q:'A scientist and an engineer both study the same river. What different questions are they likely to ask?',
  a:'The scientist asks “Why does it happen?” (why does the river flood, how does water flow). The engineer asks “How can we make it work?” (how do we design a dam or drainage to control it). Technology asks “How can we use it effectively?”'},
 notes:[
  {t:'Engineers are inventors and problem solvers', src:'lec', b:`${UL(['Engineers use <b>science and math to solve real-world problems</b>.','Virtually every manmade contraption around you was conceived and created by an engineer.','Common types: chemical, electrical, mechanical, software, civil, biomedical, environmental and many more.'])}<p>The slides ask you to imagine <b>a world without engineers</b>: no buildings, roads, electricity, vehicles, phones or clean water systems.</p>${KEY('Engineers: science + math + creativity → practical solutions. Scientists: seek to <b>understand</b> natural phenomena.')}`,
   c:{q:'Which statement about engineers is true?',o:['They use science and math to solve real-world problems','Only engineers ever use math','They only study natural phenomena for knowledge','They never consider practical use'],why:'Sample paper Q1 tests this. “Only engineers use math and science” is the false statement.'}},
  {t:'Why become an engineer? Benefits of engineering', src:'lec', b:`<p>Five benefits on your slide:</p>${OL(['<b>Challenging</b> (you do not get bored).','<b>Flexible</b> job opportunities.','<b>Good pay and benefits</b>.','<b>Lasting and tangible</b> products.','<b>Help to humankind</b>.'])}<p><span class="badge b-ext">extra</span> Be ready to give a short personal answer to “Why do you want to be an engineer?” using two or three of these, with one example from your chosen discipline.</p>`,
   c:{q:'Which is NOT one of the benefits of engineering listed on the slide?',o:['Guaranteed wealth without effort','Flexible job opportunities','Lasting and tangible products','Helping humankind'],why:'The slide lists challenging, flexible, good pay and benefits, lasting products and help to humankind.'}},
  {t:'What is an engineer?', src:'lec', b:`<p>An engineer is someone who uses <b>engineering problem-solving techniques</b> to <b>develop and improve</b>:</p>${UL(['Consumer products','Drugs (“the good kind”)','Factory processes','Buildings and bridges','Computer programs','Electronics'])}`,
   c:{q:'An engineer is someone who',o:['Uses problem-solving techniques to develop and improve products and processes','Only repairs machines','Only does theoretical research','Only manages money'],why:'Slide 33.'}},
  {t:'Types of engineers and what they do', src:'lec', b:`<p>Types on slide 35: aerospace, agricultural, architectural, automotive, biological, ceramic, chemical, civil, computer science, electrical, environmental, geological, marine, mechanical, materials, mining, nuclear, ocean, petroleum, systems, textile, transportation.</p>${T(['Discipline','Focus on the slides'],[['Biological','Understanding biological systems; designing medical devices'],['Chemical','Design products and processes'],['Civil','Design buildings, bridges, roads and other infrastructure'],['Computer','Software and computer programs'],['Electrical','Electricity, electronics, electromagnetism'],['Mechanical','Design, build and test machines, engines and tools']])}<p><span class="badge b-smp">sample paper Q5</span> A medical prosthetics design team would include biomedical, mechanical and systems engineers. A <b>data engineer</b> is the least likely member of that team.</p>${KEY('Pick the team by what the project needs: body and medical → biomedical; moving parts → mechanical; combining parts → systems.')}`,
   c:{q:'Which engineer is least likely to be in a medical prosthetics design team?',o:['Data engineer','Biomedical engineer','Mechanical engineer','Systems engineer'],why:'Prosthetics need body, mechanics and systems knowledge more than data pipelines.'}},
  {t:'How scientists solve problems: the scientific method', src:'lec', b:`<p>Scientists ask “what is the underlying mechanism or theory?” They use the <b>scientific method</b>:</p>${OL(['Ask a question','Research what has been done before','Lots of thinking','Form a <b>hypothesis</b> (a testable prediction)','Test the hypothesis (an actual experiment)','Analyse data','Form conclusions','Take appropriate action based on the conclusions'])}<div class="key"><b>Sample paper Q3:</b> “A hypothesis is a test of a proposed explanation of a problem.” This is <b>False</b>. The hypothesis is the proposed, testable explanation or prediction. The <b>experiment</b> is the test. <span class="mini">(The sample paper has no answer key; this answer follows the slide wording.)</span></div>`,
   c:{q:'A hypothesis is',o:['A testable prediction or proposed explanation','The experiment itself','A final conclusion','A product prototype'],why:'The experiment tests the hypothesis.'}},
  {t:'How engineers solve problems: the design process', src:'lec', b:`<p>Engineers think “I want to build something amazing!” and use the <b>design process</b>:</p>${OL(['Define the problem','Research what has been done before','Lots of thinking','Create <b>criteria</b> (may be known, or found by the scientific method)','Design the product (computer simulations, optimisation, improvement)','Build a <b>prototype</b> (lets customers know what they are getting)'])}<p>The slide loop: <b>Identify the problem → Research the problem → Find possible solutions → Select one solution → Construct an initial design → Test and modify the design → Present your design → Redesign</b> (repeat).</p><p><span class="badge b-smp">sample paper Q4</span> The creative processes a design team conducts: problem definition, idea generation, solution implementation. <b>Team bonding is not</b> a design-process step.</p>${KEY('The design process is a <b>loop</b>: testing leads to redesign.')}`,
   c:{q:'Which is NOT an engineering creative process step?',o:['Team bonding','Problem definition','Idea generation','Solution implementation'],why:'Team bonding is a social activity, not a design step.'}},
  {t:'Science vs engineering vs technology', src:'lec', b:`${T(['Aspect','Science','Engineering','Technology'],[['Focus','Understanding natural phenomena','Applying scientific knowledge to design, build, analyse','Implementing and using tools and systems'],['Goal','Discover and explain laws of nature','Solve practical problems','Make life easier, faster, more efficient'],['Output','Knowledge, theories, models','Prototypes, products, systems','Devices, software, methods'],['Key question','“Why does it happen?”','“How can we make it work?”','“How can we use it effectively?”'],['Example','Discovering electromagnetism','Designing an electric motor','Using the motor in a washing machine'],['Tools','Experiments, observations, equations','Design models, simulations, testing','Equipment, digital platforms'],['Measured by','Accuracy and validity','Efficiency, safety, reliability','Accessibility, usability, impact']])}${KEY('Three key questions: Why? → How can we make it work? → How can we use it effectively?')}`,
   c:{q:'Designing an electric motor is an example of',o:['Engineering','Science','Technology','Hypothesis testing'],why:'Science discovers electromagnetism; technology uses the motor in a washing machine.'}}
 ],
 examples:[
  {t:'Classify the activity', q:'Classify as science, engineering or technology: (a) measuring how fast bacteria grow (b) designing a water filter for a village (c) a farmer using a solar water pump.', steps:['(a) Understanding a natural phenomenon → science.','(b) Applying knowledge to design a solution → engineering.','(c) Using a device that already exists → technology.'],ans:'(a) science (b) engineering (c) technology.'},
  {t:'Apply the design loop', q:'Your hostel loses power every evening. Apply the design process in order.', steps:['Define: unreliable evening supply.','Research: how neighbouring hostels solved it, loads and costs.','Criteria: cost, safety, hours of supply.','Find and select a solution: e.g. solar plus battery.','Build a small prototype and test.','Modify and present. Redesign if tests fail.'],ans:'Define → research → criteria → select → prototype → test → redesign.'},
  {t:'Choose the right team', q:'A project to build a robotic arm for patients needs which engineers?', steps:['Mechanical for joints and motors.','Electrical/electronic for sensors and power.','Computer/software for control.','Biomedical for the patient interface.','Systems engineer to integrate the parts.'],ans:'Mechanical, electrical, software, biomedical and systems engineers.'}
 ],
 mist:['Saying “only engineers use math and science”. Scientists and others do too.','Treating a hypothesis as the experiment. It is the testable prediction.','Forgetting that the design process is a loop with redesign.','Confusing science (why), engineering (how to make it work) and technology (how to use it).'],
 quiz:[
  {q:'The key question of science is',o:['Why does it happen?','How can we make it work?','How can we use it effectively?','How much does it cost?'],why:'Science seeks understanding.'},
  {q:'The key question of engineering is',o:['How can we make it work?','Why does it happen?','What is the law of nature?','Who invented it?'],why:'Engineering applies knowledge to build.'},
  {q:'Using a motor in a washing machine is an example of',o:['Technology','Science','Engineering','Biology'],why:'Technology = application and use.'},
  {q:'The first step of the engineering design process is to',o:['Define or identify the problem','Build the final product','Present the design','Redesign'],why:'Everything starts with the problem.'},
  {q:'The output of engineering is mainly',o:['Prototypes, products and systems','Theories only','Laws of nature','Publications only'],why:'Slide 45.'}
 ],
 more:[
  {q:'Engineering outcomes are judged by',o:['Efficiency, safety and reliability','Accuracy and validity of findings','Accessibility only','Popularity'],why:'Science is judged by accuracy and validity; technology by usability and impact.'},
  {q:'Technology outcomes are judged by',o:['Accessibility, usability and impact on daily life','Validity of laws','Safety of design only','Number of papers'],why:'Slide 45.'},
  {q:'After forming a hypothesis the scientist',o:['Tests it with an experiment','Builds a prototype','Presents the design','Ends the study'],why:'Scientific method order.'},
  {q:'A prototype lets customers',o:['Know what they are getting','Avoid testing','Skip the design','Learn the laws of nature'],why:'Slide 43.'},
  {q:'Biological engineering focuses on',o:['Understanding biological systems and designing medical devices','Designing roads','Writing software','Drilling oil'],why:'Slide 36.'},
  {q:'Civil engineers design',o:['Buildings, bridges, roads and other infrastructure','Drugs only','Chips only','Engines only'],why:'Slide 38.'},
  {q:'Computer engineering deals with',o:['Software and computer programs','Oil wells','Bridges','Textiles'],why:'Slide 39.'},
  {q:'In the design process, criteria',o:['May be known or found using the scientific method','Are never needed','Come after the prototype','Are the same as a hypothesis'],why:'Slide 43.'},
  {q:'Scientists approach a problem by asking about',o:['The underlying mechanism or theory','Building something amazing','Marketing','Cost only'],why:'Slide 42.'},
  {q:'The design loop ends with',o:['Present the design and redesign','Define the problem','Research','Hypothesis'],why:'The cycle repeats.'},
  {q:'“Virtually every manmade contraption you see was conceived by”',o:['An engineer','A politician','A biologist only','A banker'],why:'Slide 28.'},
  {q:'A realistic reason to choose engineering is that it',o:['Gives lasting, tangible products that help humankind','Has no challenges','Needs no math','Is always easy'],why:'Benefits slide.'}
 ]},

/* ================= 3 ================= */
{id:'l3', wk:'Week 3', blk:'mid', title:'The Engineering Profession: Fields, Cadres, Licensing and Bodies', short:'Engineering profession', ch:'Presentation 2 · all slides · sample paper Q7',
 big:'Know the engineering fields, the four cadres, the Nigerian routes to registration, the professional bodies, and why internships matter.',
 think:{q:'On a bridge construction site, who actually welds the steel and pours the concrete: the engineer, the technologist, the technician or the craftsman?',
  a:'The craftsmen. The engineer designs and plans, the technologist interprets and executes the design, the technician supervises hands-on tasks, and the craftsmen carry out the physical work such as welding and pouring concrete.'},
 notes:[
  {t:'Choosing a career in engineering', src:'lec', b:`${UL(['Numerous and diverse careers are available.','No one can (or should) make the decision for you.','Choosing your course and ultimately your career is a <b>process</b>.','Constantly evaluate and re-evaluate what you learn and experience.','True success in a profession is <b>not measured in money</b>: job satisfaction, enjoying what you do, doing what you enjoy.'])}`,
   c:{q:'According to the slide, true success in a profession is measured by',o:['Job satisfaction, not monetary terms','Salary only','Job title only','Number of degrees'],why:'Slide 3.'}},
  {t:'Chemical and civil engineering', src:'lec', b:`${T(['','Chemical (ChE)','Civil (CVE)'],[['What','Study, design, production and manufacture of products using chemical processes. Use chemistry, physics, biology, maths and economics','Design, development and maintenance of the constructed and natural built environment'],['Works on','Chemicals, fuels, foods, pharmaceuticals, plant design, safety, environmental remediation, pollution prevention','Airports, bridges, buildings, canals, dams, pipelines, power plants, railways, roads, sewage systems'],['Tasks','Research and develop products; design processes; troubleshoot plants; sales and technical support; biotechnology; solve environmental problems','Design structures from small buildings to skyscrapers and offshore platforms; dams and foundations; pavement materials; transport; water systems; construction and project management'],['Where','Laboratories, offices, production plants, construction sites','Public or private sector, large or small projects']])}${KEY('ChE = alter chemical/biochemical/physical state of a substance. CVE = infrastructure and built environment.')}`,
   c:{q:'Dams, bridges, roads and sewage systems are the work of',o:['Civil engineers','Chemical engineers','Computer engineers','Mechatronics engineers'],why:'Civil engineering covers infrastructure.'}},
  {t:'Computer, electrical/electronic and mechanical engineering', src:'lec', b:`${T(['Field','Key points'],[['Computer (CPE)','Sits <b>between the hardware of electrical engineering and the software of computer science</b>. Designs processors for computers, phones, appliances, cars, spacecraft, GPUs and AI hardware. Comfortable with both hardware and software. Titles: hardware engineer, firmware engineer, embedded software engineer, validation engineer, systems engineer'],['Electrical/Electronic (EEE)','Design, study and application of devices and systems using electricity, electronics, electromagnetism. Areas: power generation and distribution, communication systems, control systems, process instrumentation, integrated circuit design, robotics, telecommunications, electromagnetic waves'],['Mechanical (ME)','Design, develop, build and test mechanical devices, tools, engines and machines across the product lifecycle. Uses CAD/CAM and simulations. Needs dynamics, mechanics, thermodynamics, structural analysis. Tasks: analyse failures, design/redesign devices, build and test prototypes, oversee manufacturing']])}`,
   c:{q:'Computer engineering sits between',o:['Electrical hardware and computer science software','Civil and chemical engineering','Mechanical and petroleum engineering','Biology and chemistry'],why:'Slide 15.'}},
  {t:'Petroleum, information and communications, mechatronics and software engineering', src:'lec', b:`${T(['Field','Key points'],[['Petroleum and Gas (PGE)','Drill, extract, separate, measure and transport oil and gas safely and economically. Duties: design extraction systems, injection technology, oversee extraction machinery safely, assess production, suggest improvements. Work in offices and at drilling and well sites'],['Information and Communications (ICE)','Mix of hardware and software for conveying information: networks, wireless, signal processing, radar, antennas, radio wave propagation. Industries: internet and computing, networking and telecommunications, radio'],['Mechatronics','Multidisciplinary: <b>mechanics + electronics + computing</b>. Robotics, control systems, electro-mechanical systems. Foundation for automation and manufacturing'],['Software','Design, development, testing and maintenance of software. Games, business applications, operating systems, network control, middleware. Titles: applications architect, developer, database administrator, mobile developer']])}`,
   c:{q:'Mechatronics combines',o:['Mechanics, electronics and computing','Biology, chemistry and physics','Civil, chemical and marine','Software and finance'],why:'Slide 26.'}},
  {t:'Salaries on the slides (context only)', src:'lec', b:`<p>Salaries vary by role, employer, location and experience, and generally rise with experience. The slides quote Glassdoor figures for Nigeria and US Bureau of Labor Statistics figures. Do not memorise numbers; know the patterns.</p>${T(['Field','Nigeria (Glassdoor, per month)','US (BLS)'],[['Chemical','Avg NGN 180,000 (total est. 192,486, Lagos)','–'],['Civil','Avg NGN 150,000 (total est. 390,000, Abuja)','$88,050 median (2021)'],['Computer','Avg NGN 80,000','About $70,000 mean starting'],['Electrical/Electronic','Avg NGN 140,000','$106,950 (May 2023)'],['Mechanical','Avg NGN 140,000 (Lagos)','$95,300 (2021)'],['Petroleum','Avg NGN 204,000','$135,690 (May 2023)'],['ICE','Median NGN 64,606','–'],['Mechatronics','Median NGN 80,000','$72,430 (2023)'],['Software','Avg NGN 350,000 (Lagos)','$132,270 (May 2023)']])}<p class="mini">Highest US median on the slides: petroleum. Highest average Nigerian figure on the slides: software.</p>`,
   c:{q:'Which field has the highest US median wage quoted on the slides?',o:['Petroleum engineering','Civil engineering','Mechatronics','Mechanical engineering'],why:'$135,690 in May 2023.'}},
  {t:'The four cadres of the engineering profession', src:'lec', b:`<p>The profession is a <b>pyramid</b> of four cadres:</p>${T(['Cadre','Qualification (Nigeria)','Role'],[['Engineers (top)','B.Eng. (often M.Eng./PhD)','Design, planning, budgeting, project execution and supervision. “Problem solvers”. Head of the firm; gets reports from the technologist'],['Technologists','Higher National Diploma (HND)','Interface between engineer and technician; interpret and execute designs; supervise technicians'],['Technicians','Ordinary National Diploma (OND) or Full Technological Certificate (FTC)','Direct supervisors of craftsmen; handle practical, detailed tasks like testing materials, setting up equipment'],['Craftsmen (base)','Senior Secondary School Certificate or training certificate','Physical building work. Oldest members of the family (“ancient engineers”). Carpenters, mechanics, electricians, masons, plumbers, welders']])}${KEY('Engineer → Technologist → Technician → Craftsman. Remember: B.Eng, HND, OND/FTC, SSCE.')}`,
   c:{q:'In Nigeria, a technologist is expected to hold',o:['An HND','An OND','A B.Eng.','A PhD only'],why:'Slide 33.'}},
  {t:'Example: the cadres on a bridge project', src:'lec', b:`${T(['Cadre','Role in building a bridge'],[['Engineers','Overall design and planning; calculate forces; choose materials; ensure safety, legal standards, environmental impact'],['Technologists','Apply the design to specific technical parts, e.g. how to set up support beams; supervisory and hands-on'],['Technicians','Test materials, set up equipment, operate machines; follow plans'],['Craftsmen','Weld, pour concrete, assemble metal parts; precise physical work']])}<p>Each role builds on the one before: big-picture design → technical implementation → skilled physical work.</p>`,
   c:{q:'Calculating the forces on a bridge and choosing materials is the work of',o:['Engineers','Craftsmen','Technicians','Labourers'],why:'Design and analysis are engineers’ duties.'}},
  {t:'How to become an engineer in Nigeria', src:'lec', b:`${T(['Route','Requirements'],[['Route 1: degree','Bachelor’s in engineering from a COREN-accredited programme → at least <b>four years</b> of documented, endorsed practical experience → apply to COREN, submit documents, pass the professional assessment, pay fees → receive a registration number and practising licence (renewed as COREN requires)'],['Route 2A: HND','HND in engineering + COREN-accredited PGD in the same discipline (for PGDs after Dec 2021 a master’s in the discipline is also required). Or HND + M.Eng. in the same discipline with two years of experience after the M.Eng. Then professional exam and registration'],['Route 2B: science degree','B.Sc. in a science + M.Eng. in a relevant field + <b>ten years</b> of postgraduate engineering experience + minimum age <b>50</b>. Under 50 may be considered if employing at least three engineers with outstanding contributions, or exceptional talent with an engineering PhD']])}${KEY('Standard route = B.Eng. + 4 years’ experience + COREN registration. 2B = M.Eng. + 10 years + age 50.')}`,
   c:{q:'On the standard degree route, how much documented practical experience is required before applying to COREN?',o:['At least four years','One year','Ten years','None'],why:'Slide 39.'}},
  {t:'Professional engineering bodies', src:'lec', b:`<p><b>Why they matter:</b> protect the profession, provide support and guidance, register and regulate members, promote ethical practice, promote continued learning. They also publish journals and handbooks, organise courses, workshops and conferences, and hold social events.</p>${T(['Body','Role'],[['<b>COREN</b> Council for the Regulation of Engineering in Nigeria','Government regulatory agency; umbrella regulator of all engineering personnel; registry, licensing and discipline; issues the practising licence'],['<b>NSE</b> Nigerian Society of Engineers','Umbrella organisation for the <b>engineers</b> cadre; professional needs, recognition, continual learning'],['<b>NATE</b> Nigerian Association of Technologists in Engineering','Engineering <b>technologists</b>'],['<b>NISET</b> Nigeria Society of Engineering Technicians','Professional <b>technicians</b>'],['<b>NAEC</b> Nigerian Association of Engineering Craftsmen','<b>Craftsmen</b> cadre'],['Other Nigerian bodies','APWEN (women), NIEEE (electrical/electronic), NICE (civil), NiMechE (mechanical), ACEN (consulting), NSChE (chemical)'],['International','IEEE, SPE, ASCE, ASME, NSPE, INCOSE, SWE']])}<div class="warn"><b>Slide typo:</b> slide 48 writes “National Society of Professional Engineers (ASPE)”. The correct abbreviation is <b>NSPE</b>.</div>`,
   c:{q:'Which body issues the professional practising licence in Nigeria?',o:['COREN','NSE','NISET','IEEE'],why:'COREN registers, licenses and disciplines.'}},
  {t:'Pursuing student opportunities: internships', src:'lec', b:`<p><b>Why internships:</b> bridge classroom and the professional world; build a better résumé; possibly higher starting salary offers; gain experience and exposure; network and increase marketability; may fulfil academic requirements and earn money.</p><p><b>Facts to know:</b> many companies report that over <b>70%</b> of full-time hires come from their internship programmes. Only about <b>a quarter</b> of internship opportunities are posted. Start looking <b>one to two semesters</b> before the desired start.</p>${UL(['Use the campus career centre, workshops and recruiting system.','Attend career fairs; contact companies directly.','Network (friends, family, professors, LinkedIn). Be careful what your profile shows.'])}<div class="key"><b>Sample paper Q7:</b> internships do not teach you “the futility of classroom teachings”. They link theory to practice.</div>`,
   c:{q:'Which is NOT an objective of internships?',o:['Realising the futility of classroom teaching','Widening your professional network','Building a stronger résumé','Gaining professional exposure'],why:'Internships complement the classroom.'}}
 ],

{id:'l4', wk:'Week 4', blk:'mid', title:'Ethics Foundations and Ethical Theories', short:'Ethics & theories', ch:'Presentation 3 · slides 2–28 · sample paper Q2',
 big:'Understand profession, ethics, morals, dilemmas, conflict of interest and the five ethical theories, and apply them to the trolley problem.',
 think:{q:'A runaway trolley will kill five people unless you pull a lever that sends it to a track where it kills one. What do you do, and why?',
  a:'There is no single “correct” answer. Utilitarianism says pull (save more lives). Duty ethics says do not pull (you must not actively kill). Rights ethics protects the one person’s rights. Virtue ethics asks what a virtuous person would do. The point is to reason clearly from a theory.'},
 notes:[
  {t:'What is a profession?', src:'lec', b:`<p>A <b>profession</b> is any occupation that provides a means to earn a living. In a deeper sense it involves three things:</p>${T(['Feature','Meaning'],[['Advanced expertise','Sophisticated skills and theoretical knowledge used to exercise judgement'],['Self-regulation','Societies of professionals set admission standards, draft codes of ethics, enforce conduct standards and represent the profession to public and government'],['Public good','Serves an important aspect of public good, e.g. safety, health and well-being']])}${KEY('Profession = expertise + self-regulation + public good.')}`,
   c:{q:'Which is NOT one of the three features of a profession?',o:['Maximum profit','Advanced expertise','Self-regulation','Serving the public good'],why:'Profit is not a defining feature.'}},
  {t:'Ethics and morality', src:'lec', b:`<p><b>Ethics (moral philosophy)</b> is the branch of philosophy that <b>systematises, defends and recommends</b> concepts of right and wrong conduct. It tackles good and evil, right and wrong, virtue and vice, justice and crime.</p><p><b>Morality</b> concerns right and wrong, good and bad, and the rules we ought to follow. It is about <b>reasons centred in respect</b> for others and ourselves: being fair and just, respecting rights, avoiding cheating and dishonesty, caring, showing gratitude and empathy, minimising damage to the environment.</p>`,
   c:{q:'Ethics is best described as',o:['A branch of philosophy about right and wrong conduct','The study of machines','A government department','Only religious rules'],why:'Slide 5.'}},
  {t:'Ethics vs morals', src:'lec', b:`${T(['','Ethics','Morals'],[['What','Rules or principles from an <b>external</b> source (profession, organisation, society)','An individual’s <b>personal</b> beliefs about right and wrong'],['Source','Social system (external)','Individual (internal): upbringing, religion, culture'],['Used in','Professional or social settings (medical ethics, business ethics)','Personal behaviour and choices, regardless of external rules'],['Example','A doctor keeps patient confidentiality even if personally disagreeing','A person who believes lying is always wrong, even a small kind lie']])}${KEY('Ethics = external rules. Morals = internal beliefs.')}<div class="key"><b>Sample paper Q2 area:</b> know the definition of <b>conflict of interest</b> (next boxes).</div>`,
   c:{q:'Which of these comes from an external source such as a profession?',o:['Ethics','Morals','Personal taste','Habit'],why:'Morals are internal and individual.'}},
  {t:'Engineering ethics and why we study it', src:'lec', b:`<p><b>Engineering ethics</b> is the field of applied ethics and system of moral principles for the practice of engineering. It sets the engineer’s obligations <b>to society, to clients and to the profession</b>. It includes safety and reliability of designs, protecting the environment, respecting intellectual property, and honesty and transparency with clients and colleagues. It relates to the philosophy of science and engineering and to the ethics of technology.</p><p><b>Why study it?</b></p>${UL(['<b>Professional responsibility</b>: design safe, reliable, beneficial technology.','<b>Legal and regulatory compliance</b>: understand codes enforced by law.','<b>Reputation and trust</b>: integrity builds career and organisation.','<b>Social responsibility</b>: awareness of impact on people, environment and future generations.'])}<p>The direct aim is to increase the ability to deal with <b>moral complexity</b> and to improve reasoning. The unifying goal is <b>moral autonomy</b>: “self-determining” or independent thinking about ethical issues, based on moral concern. It does not force particular beliefs.</p>`,
   c:{q:'The unifying goal of studying engineering ethics is to increase',o:['Moral autonomy','Profit','Obedience','Salary'],why:'Autonomy literally means self-determining.'}},
  {t:'Moral dilemmas and conflict of interest', src:'lec', b:`<p>A <b>moral dilemma (ethical conundrum)</b> arises when two or more moral obligations, duties, rights or ideals conflict, and you must choose between them.</p>${EG('A nurse learns a patient is terminally ill. The family asks her not to tell the patient. Honesty conflicts with avoiding distress and respecting the family.')}<p>Even “do not lie, do not steal, do not kill” can have justified exceptions when they conflict with more pressing moral duties.</p><p>A <b>conflict of interest</b> occurs when a person or organisation has <b>competing interests or loyalties that could interfere with fair, objective decisions</b>.</p>${EG('A manager hiring a contractor learns his brother’s firm has applied. He should <b>disclose</b> the relationship and step aside from the decision.')}${KEY('Conflict of interest: a clash between private interest and official responsibilities of a person in a position of trust. Remedy: disclose and step aside.')}`,
   c:{q:'What is a conflict of interest?',o:['A clash between private interest and the official responsibilities of a person in a position of trust','Personal hobbies interfering with education','Two groups disagreeing over similar interests','Interest in conflict resolution'],why:'This is the sample paper Q2 correct answer.'}},
  {t:'Why do people make ethical decisions?', src:'lec', b:`<p>Two reasons:</p>${OL(['They wish to make the world a better place for everyone: <b>altruism</b>.','They wish to avoid unpleasant consequences such as fines, jail or job loss.'])}<p>In an ideal society the second reason would not exist. Societies create rules, codes and laws that specify acceptable behaviour and punishments. We make ethical decisions daily: obeying speed limits, returning a shopping cart, reporting exam cheating, correcting a cashier’s wrong change.</p>`,
   c:{q:'Wanting to make the world better for everyone is called',o:['Altruism','Relativism','Compliance','Retaliation'],why:'Slide 16.'}},
  {t:'Ethical theories 1: relativism and utilitarianism', src:'lec', b:`<p>An ethical theory defines terms uniformly and links ideas consistently. Five theories: relativism, utilitarianism, duty ethics, rights ethics, virtue ethics.</p>${T(['Theory','Idea','Example'],[['Relativism','No universal right and wrong. Right/wrong varies by person or society. Ethics is relative to one’s society or organisation','Polygamy accepted in some cultures, not others; gift-giving judged differently. Still check whether a gift could influence a decision and what the code requires'],['Utilitarianism','An action is right if it gives <b>more overall good (or less harm)</b> than alternatives. “Greatest Happiness Principle”','A dam supplies electricity but displaces households and damages ecosystems. Often used to justify war']])}`,
   c:{q:'Utilitarianism judges an action by its',o:['Outcomes (overall good)','Intentions only','Culture','Duty to rules'],why:'Greatest happiness principle.'}},
  {t:'Ethical theories 2: duty, rights and virtue ethics', src:'lec', b:`${T(['Theory','Idea','Example'],[['Duty ethics (deontology)','Follow moral rules or duties <b>regardless of consequences</b>','Return a found wallet because stealing is wrong. An engineer reports test results honestly even if delivery is delayed'],['Rights ethics','Respect and protect individual rights (life, freedom, privacy). Treat people with dignity','A student ID system must consider privacy as well as security'],['Virtue ethics','Develop good character (honesty, kindness, courage). Asks “What kind of person should I be?”','An engineer admits a calculation error and helps correct it']])}${KEY('Outcomes → utilitarianism. Rules → duty. Rights → rights. Character → virtue. Culture → relativism.')}`,
   c:{q:'Virtue ethics asks',o:['What kind of person should I be?','What will give the greatest happiness?','What does my culture say?','What rule must I follow?'],why:'It focuses on character.'}},
  {t:'The trolley problem across theories', src:'lec', b:`${T(['Theory','Trolley response'],[['Relativism','Do what your society says is right'],['Utilitarianism','Pull the lever (save more lives)'],['Duty ethics','Do not pull the lever (rule: do not kill)'],['Rights ethics','Do not violate the one person’s rights'],['Virtue ethics','Depends on which virtue you prioritise']])}`,
   c:{q:'Which theory most clearly says “pull the lever”?',o:['Utilitarianism','Duty ethics','Rights ethics','Relativism'],why:'Saving five outweighs losing one.'}},
  {t:'Ethics in military technology', src:'lec', b:`<p>Four questions engineers should ask:</p>${T(['Question','Meaning'],[['Purpose','Is the intended use defensible? Who benefits and who may suffer?'],['Protection','Can the system tell military targets from civilians and reduce civilian harm?'],['Human control','Can people understand, supervise and stop it? Who is accountable?'],['Dual use','Could technology built for good enable harm?']])}${EG('A rescue drone is adapted for combat. What responsibilities do its designers have?')}<p><b>Engineer’s duty:</b> assess harm, report limitations and challenge unsafe or unlawful uses.</p>`,
   c:{q:'“Dual use” means',o:['Technology made for a beneficial purpose could also enable harm','Two engineers sharing a task','A machine with two engines','Using one code twice'],why:'Slide 27.'}},
  {t:'Ethical questions in healthcare and research', src:'lec', b:`<p>Engineers’ role: design safe systems, explain risks, respect users’ dignity.</p>${T(['Area','Tension','Key points'],[['Euthanasia','Personal choice and relief of suffering vs protection of life and vulnerable people','Consent, coercion, alternatives. Intentionally causing death differs from respecting refusal of unwanted treatment'],['Animal testing','Medical progress vs animal suffering','<b>3Rs</b>: Replace, Reduce, Refine'],['Human drug trials','Developing treatments vs risk and exploitation','Independent ethics review, justified risks, fair recruitment, informed voluntary consent, right to withdraw. <b>Consent alone is not enough</b>']])}${KEY('3Rs of animal testing: Replace · Reduce · Refine.')}`,
   c:{q:'The 3Rs in animal testing are',o:['Replace, Reduce, Refine','Record, Report, Review','Repair, Reuse, Recycle','Research, Revise, Release'],why:'NC3Rs framework.'}}
 ],
 examples:[
  {t:'Spot the conflict of interest', q:'An engineer on a tender panel owns shares in one bidder. What should she do?', steps:['Identify the competing interest (private shares vs objective evaluation).','Disclose it to the employer or panel.','Step aside from the decision.'],ans:'Disclose and recuse herself.'},
  {t:'Apply theories to a dam', q:'A dam will power a city but displace 500 families. Give a response from three theories.', steps:['Utilitarian: compare total benefit and total harm; build if benefit is greater.','Rights ethics: displaced families have rights to home and fair compensation; protect them.','Virtue ethics: would an honest, fair and caring engineer ignore the families?'],ans:'Different theories weigh outcomes, rights and character differently.'},
  {t:'Ethics or morals?', q:'A hospital rule says staff must keep records confidential. A nurse also privately believes lying is always wrong. Which is which?', steps:['The hospital rule comes from an organisation → ethics.','The nurse’s belief is personal → morals.'],ans:'Rule = ethics. Personal belief = morals.'}
 ],

 ],

/* ================= 5 ================= */
{id:'l5', wk:'Weeks 4–5', blk:'mid', title:'Ethical Decision Making, Whistleblowing and Responsibility', short:'Decision making & whistleblowing', ch:'Presentation 3 · slides 29–48 · sample paper Q14, Q15',
 big:'Use the four-step procedure, correlate three perspectives, know when and how to blow the whistle, and tell causal, legal and moral responsibility apart.',
 think:{q:'You see a classmate cheating in an exam. What are your options, and which one needs the most courage?',
  a:'Options: ignore it, tell the invigilator, or speak to the classmate. Acting is the hardest step. The four-step procedure says: find the issue and stakeholders, weigh consequences, intent and character, then act.'},
 notes:[
  {t:'The four-step procedure (overview)', src:'lec', b:`<p>Some decisions are clear-cut. Many are not, and there is <b>no proven algorithm</b> that guarantees the most ethical decision. A four-step procedure guides you:</p>${OL(['<b>Determine</b> the issues (what) and who might be affected (stakeholders).','<b>Consider</b> the effects of alternative courses of action from different perspectives.','<b>Correlate</b> the perspectives.','<b>Act</b>.'])}${KEY('Issues & stakeholders → perspectives → correlate → act.')}`,
   c:{q:'The correct order of the four-step ethical decision procedure is',o:['Issues and stakeholders → perspectives → correlate → act','Act → correlate → perspectives → issues','Perspectives → act → issues → correlate','Correlate → issues → act → perspectives'],why:'Slide 31.'}},
  {t:'Step 1: issues and stakeholders', src:'lec', b:`<p><b>Issues (what):</b> personal freedom, national security, quality of life, economics, fairness, equality.</p><p><b>Stakeholders (who):</b> an individual, a group, an institution or even a <b>natural system</b> that may be affected.</p>${EG('Fingerprinting all Nigerian children at school entry: issues are privacy vs security. Stakeholders are children, parents, government agencies.')}`,
   c:{q:'A stakeholder can be',o:['An individual, group, institution or natural system','Only a person','Only a company','Only the government'],why:'Slide 32.'}},
  {t:'Step 2: three perspectives', src:'lec', b:`${T(['Perspective','Question','Notes'],[['Consequences','How will each stakeholder be affected by each alternative? Give a weight to each effect','Harm to millions usually outweighs the same harm to a dozen'],['Intent (the “rights” perspective)','What are the actor’s intentions? Ignores outcome','Ask: Should everyone do this? Should it be law? Would I want to be on the receiving end?'],['Character','What does this say about the person acting?','Would a person of good character do this? Does it enhance or degrade my character? Would someone I revere do it?']])}${KEY('Consequences · Intent · Character.')}`,
   c:{q:'Which perspective asks “Would I like to be on the receiving end of this action?”',o:['Intent','Consequences','Character','Cost'],why:'Intent (rights) perspective.'}},
  {t:'Step 3: correlate perspectives', src:'lec', b:`<p>If all three perspectives lead to the same or similar conclusion, you can be highly confident the action is the best ethical choice.</p><p>If they disagree: reconsider. Discuss with people you have not consulted. Ask: Did I omit any factors? Did I weight aspects properly?</p>${KEY('If you still cannot get all three to agree, go with <b>two out of three</b>.')}`,
   c:{q:'If you cannot make all three perspectives agree after thorough reconsideration, you should',o:['Go with two out of three','Do nothing','Flip a coin','Follow your employer'],why:'Slide 38.'}},
  {t:'Step 4: act', src:'lec', b:`<p>Acting is often the <b>hardest step</b>, since ethical action may need courage: the whistleblower risking a job, an official standing up at the cost of an election, refusing to join questionable “fun” with friends.</p><p>Ask: “Do I have the courage to do what I know is right?”</p><div class="key"><b>Sample paper Q14:</b> if a co-worker is treated unfairly, the ethical thing is to <b>speak up</b> (not ignore, take revenge or just quit). <b>Q15:</b> faced with conflicting ethical obligations, resolve them in a way consistent with the <b>public interest</b>.</div>`,
   c:{q:'When engineers face conflicting ethical obligations they should',o:['Resolve them consistently with the public interest','Ignore them','Put personal interests first','Abandon the project'],why:'Sample paper Q15.'}},
  {t:'Worked scenarios from the slides', src:'lec', b:`${T(['Scenario','Step 1','Step 2','Step 3','Step 4'],[['Fingerprinting children','Privacy vs security; children, parents, govt','Mandatory, optional with consent, or non-biometric IDs','Govt wants security ⇄ parents want privacy','Use minimal data, ensure consent and data protection'],['Mocking a poor classmate','Bullying, peer pressure; victim, peers, you','Join, ignore, or speak up','Friends’ fun ⇄ victim hurt','Intervene respectfully; promote kindness'],['Designing e-cigarettes','Health vs profit; company, users, engineer','Accept, object, or request reassignment','Profit ⇄ public duty','Refuse or seek ethical assurance; prioritise health']])}`,
   c:{q:'In the e-cigarette scenario the recommended ethical action is to',o:['Refuse or seek ethical assurance and prioritise health','Join silently','Hide results','Maximise profit'],why:'Slide 42.'}},
  {t:'Ethical climate in organisations', src:'lec', b:`<p>An <b>ethical climate</b> is a working environment that encourages morally responsible conduct. It is produced by <b>formal policies</b> (codes, rules, training), <b>informal culture</b> (traditions, daily behaviour) and <b>personal attitudes</b> (honesty).</p>${UL(['<b>Shared ethical values</b>: honesty, fairness, respect; care about customers, employees and society, not only profit.','<b>Ethical communication</b>: talking about ethics is normal; job roles state ethical duties.','<b>Leadership by example</b>: top managers model integrity.','<b>Fair conflict resolution</b>: clear fair ways to handle disputes; employees feel safe to speak up.'])}`,
   c:{q:'Which is a feature of an ethical corporate climate?',o:['Leadership by example','Silence about ethics','Profit above all','Fear of reporting'],why:'Slide 44.'}},
  {t:'Whistleblowing', src:'lec', b:`<p><b>Whistleblowing</b> is speaking out about unethical, unsafe or illegal practices in an organisation, to protect public safety, integrity and environment when internal systems fail.</p><p><b>When it arises:</b> an engineer’s professional duty conflicts with the employer’s instructions, or warnings are ignored and harm is likely.</p>${T(['Type','Meaning'],[['Internal','Report within the organisation'],['External','Report to outside authorities, media or the public']])}<p><b>Risks:</b> retaliation, job loss, isolation. Tension between ethical courage and loyalty.</p><p><b>Steps for ethical whistleblowing:</b></p>${OL(['Identify the ethical issue (serious misconduct, safety, corruption, falsification, environmental harm). Confirm facts.','Gather dated evidence.','Use <b>internal channels first</b> (supervisor, ethics office, compliance).','Escalate responsibly to authorities or bodies (COREN, NSE, safety regulators) if internal reporting fails or danger is urgent. Stay factual.','Seek guidance and protection (code of ethics, mentor, whistleblower laws).','Stay ethical and objective: act for public welfare, not revenge or publicity; keep confidentiality and honesty.'])}`,
   c:{q:'What should an engineer normally do first when discovering a serious unsafe practice?',o:['Use internal channels','Go to the media','Do nothing','Leak documents online'],why:'Give management a chance to correct it first, unless danger is urgent.'}},
  {t:'Causal, legal and moral responsibility', src:'lec', b:`${T(['Type','Question','Example'],[['Causal','What contributed to the event?','A failed component contributed to a fire'],['Legal','What duties or liabilities arise under law?','A court examines evidence and legal duties'],['Moral','What should someone have done, and how do we judge their conduct?','An engineer knowingly skipped a required safety test']])}${KEY('Cause = what happened. Legal = what the law says. Moral = what should have been done.')}`,
   c:{q:'“An engineer knowingly skipped a required safety test” is an example of',o:['Moral responsibility','Causal responsibility only','Legal responsibility only','No responsibility'],why:'Slide 48.'}}
 ],
 examples:[
  {t:'Apply the four steps', q:'A supervisor asks you to sign off a test report you know was not completed. Decide.', steps:['Step 1: issue is honesty and safety; stakeholders are users, public, employer, you.','Step 2: consequences (possible harm), intent (would I want everyone to falsify?), character (would an honest engineer sign?).','Step 3: all three say do not sign.','Step 4: refuse, document, report internally; escalate if ignored.'],ans:'Do not sign. Document and report through proper channels.'},
