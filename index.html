<script>
/* ---------- helpers used inside content strings ---------- */
const V = s => `<b class="v">${s}</b>`;
const bi = V('i'), bj = V('j'), bk = V('k');
const AR = s => `<span class="ar">${s}</span>`;
const F = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R = s => `<span class="sq">√<span>${s}</span></span>`;
const vec = (...c) => {
  let s = '';
  c.forEach((x, t) => {
    if (x === 0) return;
    const a = Math.abs(x), co = a === 1 ? '' : a;
    s += (s === '' ? (x < 0 ? '−' : '') : (x < 0 ? ' − ' : ' + ')) + co + V(['i', 'j', 'k'][t]);
  });
  return s || '0';
};
const WEEKS = [];

WEEKS.push({
  n: 1, lab: 'vector',
  title: 'Vectors & Scalars',
  sub: 'Definitions, geometric representation, components, magnitude, unit vectors, collinearity, addition, scalar multiplication, linear independence',
  src: 'MTH103 Units 1–4 + added material',
  topics: [
    'Vectors and scalar quantities: definition and examples',
    'Geometric representation of vectors in 1–3 dimensions, components, magnitude of vectors, unit vector, collinearity',
    'Addition, scalar multiplication of vectors, and linear independence'
  ],
  sections: [
  /* ---------------------------------------------------------------- 1.1 */
  {
    t: 'Scalars, vectors and the types of vector', tag: 'notes',
    idea: `<p>Some quantities only need a <b>number</b> to describe them: "the room is 5 m long", "it took 8 seconds". Others need a number <b>and a direction</b>: "walk 5 m <i>north</i>", "push with 40 N <i>downward</i>". The first kind are <b>scalars</b>, the second kind are <b>vectors</b>.</p>
    <p>Ask yourself one question: <i>"If I only tell you the number, is the picture complete?"</i> If yes → scalar. If you'd still ask "which way?" → vector.</p>`,
    notes: [
      `<b>Scalar</b> = magnitude (size) only, no direction. Examples: length, area, volume, mass, time, speed, temperature, energy.`,
      `<b>Vector</b> = magnitude <u>and</u> direction. Examples: force, velocity, acceleration, displacement, weight, momentum.`,
      `Notation: the vector from A to B is ${AR('AB')} (or a single bold/underlined letter ${V('a')}). Its magnitude is |${AR('AB')}|, |${V('a')}| or simply a.`,
      `${AR('BA')} = −${AR('AB')}: same length, <u>opposite</u> direction.`,
      `<b>Equal vectors</b>: ${V('a')} = ${V('b')} if and only if they have the <u>same magnitude</u> AND the <u>same direction</u> (where they are drawn does not matter – parallel copies are equal).`,
      `<b>Position vector</b> – fixed at a point (usually the origin), e.g. ${AR('OP')} locates P.`,
      `<b>Line vector</b> – may slide along its line of action only (e.g. a force acting on a rigid body).`,
      `<b>Free vector</b> – not restricted at all; any of a set of equal-length parallel lines represents it. (Localized = position/line vector; free = movable anywhere – this answers Exercise 1.6 Q1.)`,
      `<b>Zero vector</b> <b>0</b>: magnitude 0, no definite direction. <b>Unit vector</b>: magnitude exactly 1. <b>Negative of a vector</b>: same size, reversed direction (Exercise 1.6 Q2–Q4).`
    ],
    ex: [
      { q: `A vertical force of 20 N acts downward. Draw it with the scale 1 cm ≙ 10 N.`,
        steps: [`Length of line = magnitude ÷ scale = 20 ÷ 10 = <b>2 cm</b>.`, `Direction: draw it vertical with the arrowhead pointing <b>down</b>.`],
        ans: `A 2 cm line with a downward arrowhead.` },
      { q: `A car travels at 60 km/h. A second car travels at 60 km/h due north. Which statement is about a vector?`,
        steps: [`The first only gives size → that is <b>speed</b> (scalar).`, `The second gives size and direction → that is <b>velocity</b> (vector).`],
        ans: `Speed is a scalar; velocity is a vector. Same number, different kind of quantity.` }
    ],
    mistake: `Students mix up <b>speed/velocity</b> and <b>distance/displacement</b>. Distance and speed are scalars; displacement and velocity are vectors.`,

  /* ---------------------------------------------------------------- 5.1 */
  {
    t: 'Cartesian plane and graphical representation of linear equations', tag: 'notes',

    <p>Use the <b>Line Lab</b> at the bottom of this section's page (Labs tab) to see how changing the points changes the line.</p>`,
    notes: [
      `<b>Cartesian coordinates:</b> a point is (x, y) = (<b>abscissa</b>, <b>ordinate</b>) – its signed distances from the y-axis and from the x-axis. E.g. (2, 3): 2 across, 3 up.`,

function weekSecDone(w) { return WK(w).sections.reduce((n, _, i) => n + (P.sec[secKey(w, i)] ? 1 : 0), 0); }
function weekFrac(w) {
  const W = WK(w);
  return 0.6 * (weekSecDone(w) / W.sections.length) + 0.4 * Math.min(100, P.quiz[w] || 0) / 100;
}
function overall() { return Math.round(100 * WEEKS.reduce((a, W) => a + weekFrac(W.n), 0) / WEEKS.length); }

/* ------------------------------------------------ timers (shared) */
let TI = null;
const stopT = () => { if (TI) { clearInterval(TI); TI = null; } };

function timerBar(def, onEnd, onState) {
  const el = document.createElement('div'); el.className = 'card tbar';
  const ops = [0, 5, 10, 15, 20, 30, 45, 60]; if (def && !ops.includes(def)) { ops.push(def); ops.sort((a, b) => a - b); }
  el.innerHTML = '<label>⏱ Timer <select>' + ops.map(m => '<option value="' + m + '"' + (m === def ? ' selected' : '') + '>' + (m ? m + ' min' : 'Off') + '</option>').join('') + '</select></label><b class="tdisp"></b><span class="tbtns"><button class="btn tgo" type="button">Start</button><button class="btn primary tfin" type="button" hidden>Finish now</button></span>';
  const sel = el.querySelector('select'), disp = el.querySelector('.tdisp'), goB = el.querySelector('.tgo'), fin = el.querySelector('.tfin');
  let mins = def || 0, run = false, ended = false, t0 = 0, used = 0;
  const note = () => { if (onState) onState(); };
  const show = () => { disp.textContent = ended ? 'Done' : run ? disp.textContent : mins ? 'Ready ' + mmss(mins * 60) : 'No limit'; goB.hidden = !mins || run || ended; };
  const c = {
    el, locked: () => mins > 0 && !run && !ended, running: () => run, timed: () => t0 > 0, used: () => used,
    stop() { stopT(); run = false; },
    end(why) {
      if (ended) return; ended = true;
      if (t0) used = why === 'time' ? mins * 60 : Math.min(Math.round((Date.now() - t0) / 1000), mins * 60);
      stopT(); run = false; sel.disabled = true; goB.hidden = true; fin.hidden = true; el.classList.remove('low');
      disp.textContent = why === 'time' ? '00:00' : 'Done'; onEnd(why);
    }
  };
  sel.onchange = () => { mins = +sel.value; show(); note(); };
  goB.onclick = () => {
    run = true; t0 = Date.now(); const end = t0 + mins * 60000; sel.disabled = true; goB.hidden = true; fin.hidden = false;
    const tick = () => { const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); disp.textContent = mmss(left); el.classList.toggle('low', left <= 60); if (left <= 0) c.end('time'); };
    tick(); if (run) TI = setInterval(tick, 250); note();
  };
  fin.onclick = () => c.end('finish');
  show(); return c;
}

/* ------------------------------------------------ routing */
let route = { v: 'home' };
const WTABS = ['learn', 'practice', 'mistakes', 'quiz', 'notebook', 'lab', 'sheet', 'fixes'];
function parse() {
  const h = (location.hash || '#/home').replace(/^#\/?/, '').split('/');
  if (h[0] === 'week' && WK(+h[1])) return { v: 'week', w: +h[1], tab: WTABS.includes(h[2]) ? h[2] : 'learn', s: +h[3] || 0 };
  if (['exam', 'formulas', 'fixes'].includes(h[0])) return { v: h[0] };
  return { v: 'home' };
}
function go(path) { if (location.hash === '#/' + path) render(); else location.hash = '#/' + path; }
window.addEventListener('hashchange', () => render(true));

/* ------------------------------------------------ nav */
function renderNav() {
  let h = `<div class="brand" data-act="home">MTH 103</div><div class="npro"><div class="bar"><i id="pfill"></i></div><span id="ptxt"></span></div>
  <a class="item ${route.v === 'home' ? 'on' : ''}" href="#/home"><span class="n">⌂</span><span class="t">Overview</span></a><div class="grp">Weeks</div>`;
  WEEKS.forEach(W => {
    const on = route.v === 'week' && route.w === W.n;
    h += `<a class="item ${on ? 'on' : ''}" href="#/week/${W.n}/learn/0"><span class="n">${W.n}</span><span class="t">Wk ${W.n} · ${W.title}<br><span class="s">${weekSecDone(W.n)}/${W.sections.length} lessons · quiz ${P.quiz[W.n] != null ? P.quiz[W.n] + '%' : '–'}</span></span></a>`;
    if (W.n === 6) h += `<a class="item" href="#/exam" data-act="preset" data-w="1,2,3,4,5,6"><span class="n">7</span><span class="t">Wk 7 · Midterm<br><span class="s">mock exam on weeks 1–6</span></span></a>`;
  });
  h += `<div class="grp">Revise</div>
   <a class="item ${route.v === 'exam' ? 'on' : ''}" href="#/exam"><span class="n">★</span><span class="t">Mock exam<br><span class="s">best ${P.exam ? P.exam + '%' : '–'}</span></span></a>
   <a class="item ${route.v === 'formulas' ? 'on' : ''}" href="#/formulas"><span class="n">∑</span><span class="t">Formula sheet</span></a>
   <a class="item ${route.v === 'fixes' ? 'on' : ''}" href="#/fixes"><span class="n">!</span><span class="t">Errors in your lecture notes</span></a>`;
  $('#nav').innerHTML = h;
  const p = overall();
  $('#pfill').style.width = p + '%'; $('#ptxt').textContent = p + '%';
}

/* ------------------------------------------------ main render */
function render(scroll) {
  stopT();
  route = parse();
  renderNav();
  const m = $('#main');
  if (route.v === 'home') m.innerHTML = viewHome();
  else if (route.v === 'week') m.innerHTML = viewWeek();
  else if (route.v === 'exam') m.innerHTML = viewExam();
  else if (route.v === 'formulas') m.innerHTML = viewFormulas();
  else if (route.v === 'fixes') m.innerHTML = viewFixes();
  if (route.v === 'week') {
    const W = WK(route.w), t = route.tab;
    if (t === 'lab' && W.lab) initLab(W.lab);
    else if (t === 'practice') mountPractice($('#dyn'), W);
    else if (t === 'quiz') mountQuiz($('#dyn'), W);
  }
  if (route.v === 'exam') mountExam();
  if (scroll) window.scrollTo(0, 0);
  document.title = 'MTH 103 Study App' + (route.v === 'week' ? ' · Week ' + route.w : '');
}

/* ---- Learn (guided stepper) */
const rev = {};      // example reveal counters
const chk = {};      // check answers in this visit
function viewLearn(W, si) {
  const S = W.sections[si], key = secKey(W.n, si);
  const steps = W.sections.map((s, i) => `<button class="${i === si ? 'on' : ''} ${P.sec[secKey(W.n, i)] ? 'done' : ''}" data-act="sec" data-s="${i}"><span class="d">${P.sec[secKey(W.n, i)] ? '✓' : i + 1}</span>${s.t.length > 30 ? s.t.slice(0, 28) + '…' : s.t}</button>`).join('');
  const last = si === W.sections.length - 1;
  return `<div class="steps">${steps}</div>
  <div class="sechead"><h2>${si + 1}. ${S.t}</h2><span class="chip ${S.tag}">${TAGS[S.tag]}</span></div>
  <div class="card"><div class="lbl">① Understand it</div><div class="idea">${S.idea}</div></div>
  <div class="card"><div class="lbl">② ✍ Write this down</div>
    <div class="paper"><ol>${S.notes.map(n => `<li>${n}</li>`).join('')}</ol></div>
    <label class="copied"><input type="checkbox" data-act="copied" data-k="${key}" ${P.notes[key] ? 'checked' : ''}> I have copied these into my notebook</label></div>
  <div class="card"><div class="lbl">③ Worked examples – try each one yourself first</div>${S.ex.map((e, i) => exHTML(W.n, si, i)).join('')}</div>
  <div class="card mistake"><div class="lbl">⚠ Common mistake</div>${S.mistake}</div>
  <div class="card"><div class="lbl">④ Check yourself</div>${S.check.map((c, i) => checkHTML(W.n, si, i)).join('')}</div>
  <div class="pager"><button class="btn" data-act="sec" data-s="${si - 1}" ${si === 0 ? 'disabled' : ''}>← Previous</button>
    ${last ? `<button class="btn primary" data-act="done" data-s="${si}" data-last="1">Mark complete → Practice</button>` : `<button class="btn primary" data-act="done" data-s="${si}">Mark complete &amp; continue →</button>`}</div>`;
}
function exHTML(w, s, e) {
  const E = WK(w).sections[s].ex[e], id = `${w}-${s}-${e}`, k = rev[id] || 0, n = E.steps.length;
  let h = `<div class="ex" id="ex-${id}"><div class="eq"><span class="k">Example ${e + 1}</span>${E.q}</div>`;
  if (k > 0) h += `<ol>${E.steps.slice(0, Math.min(k, n)).map(t => `<li>${t}</li>`).join('')}</ol>`;
  if (k > n) h += `<div class="ans"><span class="l">Answer</span>${E.ans}</div>`;
  h += `<div class="acts">`;
  if (k <= n) h += `<button class="btn" data-act="step" data-id="${id}">${k === 0 ? 'Show step 1' : k < n ? `Next step (${k}/${n})` : 'Show answer'}</button><button class="btn" data-act="all" data-id="${id}">Reveal all</button>`;
  else h += `<button class="btn" data-act="hide" data-id="${id}">Hide &amp; retry</button>`;
  return h + `</div></div>`;
}
function checkHTML(w, s, i) {
  const C = WK(w).sections[s].check[i], id = `${w}-${s}-${i}`;
  if (!chk[id]) chk[id] = { order: shuffle(C.o.map((t, j) => ({ t, ok: j === 0 }))), sel: -1 };
  const st = chk[id], done = st.sel >= 0;
  return `<div class="q" id="chk-${id}"><div class="qq">${C.q}</div><div class="opts">${st.order.map((o, j) =>
    `<button class="opt ${done ? (o.ok ? 'right' : j === st.sel ? 'wrong' : '') : ''}" data-act="chk" data-id="${id}" data-j="${j}" ${done ? 'disabled' : ''}><span class="l">${'ABCD'[j]}</span><span>${o.t}</span></button>`).join('')}</div>
    ${done ? `<div class="why"><b>${st.order[st.sel].ok ? 'Correct.' : 'Not quite.'}</b> ${C.e}</div>` : ''}</div>`;
}

/* ------------------------------------------------ PRACTICE (worked examples as a timed self-test) */
function mountPractice(p, W) {
  stopT();
  const items = []; W.sections.forEach((S, si) => S.ex.forEach((E, ei) => items.push({ E, k: W.n + '-' + si + '-' + ei, sec: si + 1 })));
  const pd = P.pr || {};
  p.innerHTML = '';
  const info = document.createElement('p'); info.className = 'lede';
  info.textContent = 'These are all of the week’s worked examples, hidden. Attempt each on paper, reveal, then tick “I got this” only if you solved it before looking. With the timer on, your score is counted from your ticks when time runs out.';
  const list = document.createElement('div'); list.className = 'stack';
  list.innerHTML = items.map((x, i) => `<details class="ex"><summary>Q${i + 1}. ${x.E.q}</summary><div class="body"><ol>${x.E.steps.map(t => `<li>${t}</li>`).join('')}</ol><div class="ans"><span class="l">Answer</span>${x.E.ans}</div><label class="chk"><input type="checkbox" data-k="${x.k}" ${pd[x.k] ? 'checked' : ''}> I got this</label></div></details>`).join('');
  const sum = document.createElement('div'); sum.style.marginTop = '12px'; let started = false;
  const boxes = () => $$('input', list);
  const tb = timerBar(0, why => {
    list.classList.remove('dim'); $$('details', list).forEach(d => d.open = true); boxes().forEach(c => c.disabled = true);
    const n = boxes().filter(c => c.checked).length, N = items.length, best = Math.max(n, (P.pbest || {})[W.n] || 0);
    P.pbest = P.pbest || {}; P.pbest[W.n] = best; save();
    sum.className = 'score card';
    sum.innerHTML = '<div><div class="qn">' + (why === 'time' ? 'Time’s up. Auto-scored' : 'Self-scored') + '</div><div class="big">' + n + '/' + N + ' · ' + Math.round(n / N * 100) + '%</div><div class="lede">Based on your ticks · ' + (tb.timed() ? 'Time used ' + mmss(tb.used()) + ' · ' : '') + 'Best: ' + best + '/' + N + '</div></div><button class="btn primary" type="button">Retry</button>';
    sum.querySelector('button').onclick = () => mountPractice(p, W);
  }, () => { list.classList.toggle('dim', tb.locked()); if (tb.running() && !started) { started = true; boxes().forEach(c => c.checked = false); } });
  list.addEventListener('change', e => { const c = e.target; if (!c.dataset.k || tb.running()) return; P.pr[c.dataset.k] = c.checked; save(); });
  p.appendChild(tb.el); p.appendChild(info); p.appendChild(list); p.appendChild(sum); list.classList.toggle('dim', tb.locked());
  const nx = document.createElement('a'); nx.className = 'btn primary'; nx.style.marginTop = '16px'; nx.href = '#/week/' + W.n + '/mistakes/0'; nx.textContent = 'Next: mistakes →'; p.appendChild(nx);
}

/* ------------------------------------------------ QUIZ (weekly) */
function mountQuiz(host, W) {
  stopT();
  const total = W.quiz.length, sizes = [8, 15, total].filter((v, i, a) => v <= total && a.indexOf(v) === i);
  const n = sizes.includes(P.qn) ? P.qn : total;
  const best = P.quiz[W.n];
  host.innerHTML = `<p class="lede">Instant feedback and an explanation after every answer. Aim for 80% or more before moving on.${best != null ? ` <b>Your best: ${best}%.</b>` : ''} Pick a timer below if you want exam conditions.</p>
  <div class="ctl"><div class="qn">Number of questions</div><div class="sw" id="qsz">${sizes.map(s => `<button type="button" data-n="${s}" aria-pressed="${s === n}">${s === total ? 'All ' + total : s}</button>`).join('')}</div></div><div id="qrun"></div>`;
  $$('#qsz button', host).forEach(b => b.onclick = () => { P.qn = +b.dataset.n; save(); mountQuiz(host, W); });
  const qs = shuffle(W.quiz).slice(0, n).map(it => { const os = shuffle(it.o.map((t, j) => ({ t, ok: j === 0 }))); return { q: it.q, o: os.map(x => x.t), c: os.findIndex(x => x.ok), w: it.e }; });
  quiz($('#qrun', host), qs, pct => {
    if (n >= 8 && pct > (P.quiz[W.n] || 0)) { P.quiz[W.n] = pct; save(); }
    renderNav();
  }, () => mountQuiz(host, W));
}
function quiz(host, qs, onScore, again) {
  stopT(); let sc = 0, ans = 0, over = false; host.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'stack'; const sumEl = document.createElement('div'); sumEl.style.marginTop = '12px';
  const tb = timerBar(0, why => finish(why), () => wrap.classList.toggle('dim', tb.locked()));
  host.appendChild(tb.el); host.appendChild(wrap); host.appendChild(sumEl); wrap.classList.toggle('dim', tb.locked());
  const blocks = [];
  qs.forEach((q, i) => {
    const d = document.createElement('div'); d.className = 'q qc';

        const mn = dy, md = dx, cn = y1 * dx - dy * x1;
        const mf = frac(mn, md), cf = frac(cn, md); mTxt = mf; yi = cf;
        const mm = dy / dx; let mt = mm === 0 ? '' : mm === 1 ? 'x' : mm === -1 ? '−x' : (mf.includes('/') ? `(${mf})x` : mf + 'x');
        const cc = cn / md; let ct = cc === 0 ? '' : (cf.includes('/') ? `(${cf})` : cf);
        eq = 'y = ' + (mt && ct ? mt + (cc < 0 ? ' − ' + ct.replace('−', '') : ' + ' + ct) : mt || ct || '0');
        let A = dy, B = -dx, C = dx * y1 - dy * x1; const g = gcd(gcd(A, B), C); A /= g; B /= g; C /= g; if (A < 0 || (A === 0 && B < 0)) { A = -A; B = -B; C = -C; }
        const t = (k, v, first) => k === 0 ? '' : (first ? (k < 0 ? '−' : '') : (k < 0 ? ' − ' : ' + ')) + (Math.abs(k) === 1 && v ? '' : Math.abs(k)) + v;
        let s = t(A, 'x', true); const b2 = t(B, 'y', s === ''); s += b2; s += t(C, '', s === ''); gen = s.replace(/-/g, '−') + ' = 0';
      }
      const th = dx === 0 ? 90 : (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 180;
      out.innerHTML = row('gradient m', mTxt) + row('angle of slope', fmt(th) + '°') + row('y-intercept', yi) + row('equation', eq, true) + row('general form', gen) + row('distance PQ', `${fmt(Math.sqrt(d2))}  (√${d2})`) + row('midpoint M', `(${fmt((x1 + x2) / 2)}, ${fmt((y1 + y2) / 2)})`) + row('perp. gradient', dx === 0 ? '0' : dy === 0 ? 'undefined' : frac(-dx, dy));
    } else if (type === 'circle') {
      const h = val('h'), k = val('k'), r = val('r'), px = val('px'), py = val('py');
      c.strokeStyle = css('--accent'); c.lineWidth = 3; c.beginPath(); c.arc(X(h), Y(k), r * U, 0, 7); c.stroke();
      c.strokeStyle = css('--warm'); c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(X(h), Y(k)); c.lineTo(X(h + r), Y(k)); c.stroke(); c.setLineDash([]);
      dot(h, k, css('--warm'), `C(${h}, ${k})`); const fv = (px - h) ** 2 + (py - k) ** 2 - r * r; dot(px, py, css('--good'), 'P');
      const g = -h, f = -k, cc = h * h + k * k - r * r, sg = (n, v) => n === 0 ? '' : (n < 0 ? ' − ' : ' + ') + (Math.abs(n) === 1 && v ? '' : fmt(Math.abs(n))) + v;
      const std = `(x ${h < 0 ? '+' : '−'} ${Math.abs(h)})² + (y ${k < 0 ? '+' : '−'} ${Math.abs(k)})² = ${fmt(r * r)}`.replace(/\(x − 0\)/, 'x').replace(/\(y − 0\)/, 'y');
      const gen = 'x² + y²' + sg(2 * g, 'x') + sg(2 * f, 'y') + sg(cc, '') + ' = 0';
      const where = Math.abs(fv) < 1e-9 ? 'on the circle' : fv < 0 ? 'inside' : 'outside';
      out.innerHTML = row('standard form', std, true) + row('general form', gen.replace(/-/g, '−')) + row('g, f, c', `${fmt(g)}, ${fmt(f)}, ${fmt(cc)}`) + row('centre (−g, −f)', `(${fmt(h)}, ${fmt(k)})`) + row('radius √(g²+f²−c)', fmt(r)) + row(`f(${px}, ${py})`, fmt(fv)) + row('P is', where, true);
    } else if (type === 'tcircle') {
      const h = val('h'), k = val('k'), r = val('r'), t = val('th') * Math.PI / 180, cs = Math.cos(t), sn = Math.sin(t);
      const px = h + r * cs, py = k + r * sn, S = (Math.abs(cs) < 1e-9 ? 0 : cs), T = (Math.abs(sn) < 1e-9 ? 0 : sn);
      c.strokeStyle = css('--accent'); c.lineWidth = 3; c.beginPath(); c.arc(X(h), Y(k), r * U, 0, 7); c.stroke();
      c.strokeStyle = css('--good'); c.lineWidth = 3; c.beginPath(); c.moveTo(X(px + 14 * sn), Y(py - 14 * cs)); c.lineTo(X(px - 14 * sn), Y(py + 14 * cs)); c.stroke();
      c.strokeStyle = css('--warm'); c.lineWidth = 2; c.setLineDash([6, 4]); c.beginPath(); c.moveTo(X(h - 14 * cs), Y(k - 14 * sn)); c.lineTo(X(h + 14 * cs), Y(k + 14 * sn)); c.stroke(); c.setLineDash([]);
      dot(h, k, css('--warm'), `C(${fmt(h)}, ${fmt(k)})`); dot(px, py, css('--good'), `P(${fmt(px)}, ${fmt(py)})`);
      const lineEq = (a, b, cc) => { const t = (v, n, first) => { if (Math.abs(v) < 1e-9) return ''; const m = Math.abs(v) === 1 ? '' : fmt(Math.abs(v)); return (first ? (v < 0 ? '−' : '') : (v < 0 ? ' − ' : ' + ')) + m + n; }; let l = t(a, 'x', true); l += t(b, 'y', l === ''); return l + ' = ' + fmt(cc); };
      const A = S, B = T, Cc = A * h + B * k + r, mr = S === 0 ? null : T / S, mt = T === 0 ? null : -S / T;
      const gtxt = v => v === null ? 'undefined (vertical)' : fmt(v);
      const mtxt = (S === 0) ? '0' : (T === 0 ? 'undefined (vertical)' : fmt(-S / T));
      out.innerHTML = row('point P', `(${fmt(px)}, ${fmt(py)})`) + row('radius gradient', mr === null ? 'undefined (vertical)' : fmt(mr)) +
        row('tangent gradient', T === 0 ? 'undefined (vertical)' : fmt(mt)) +
        row('tangent', lineEq(A, B, Cc), true) +
        row('normal', lineEq(B, -A, B * h - A * k)) +
        row('check', 'tangent ⟂ radius: m<sub>t</sub> × m<sub>r</sub> = −1');
    } else if (type === 'conic') {
      const kind = val('kind'), a = val('a'), b = val('b'), h = val('h'), k = val('k');
      const sh = (v, n) => v === 0 ? `${n}²` : `(${n} ${v < 0 ? '+' : '−'} ${fmt(Math.abs(v))})²`;
      c.strokeStyle = css('--accent'); c.lineWidth = 3;
      if (kind === 1) {
        c.beginPath(); for (let i = 0; i <= 120; i++) { const t = i / 120 * 2 * Math.PI; const x = h + a * Math.cos(t), y = k + b * Math.sin(t); i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)); } c.stroke();
        const horiz = a >= b, A = Math.max(a, b), B = Math.min(a, b), cc = Math.sqrt(A * A - B * B), e = cc / A;
        c.strokeStyle = css('--good'); c.lineWidth = 1.5; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(X(h - a), Y(k)); c.lineTo(X(h + a), Y(k)); c.moveTo(X(h), Y(k - b)); c.lineTo(X(h), Y(k + b)); c.stroke(); c.setLineDash([]);
        const f1 = horiz ? [h - cc, k] : [h, k - cc], f2 = horiz ? [h + cc, k] : [h, k + cc];
        dot(f1[0], f1[1], css('--warm'), 'F₁'); dot(f2[0], f2[1], css('--warm'), 'F₂'); dot(h, k, css('--ink'), '', true);
        out.innerHTML = row('equation', `${sh(h, 'x')}/${fmt(a * a)} + ${sh(k, 'y')}/${fmt(b * b)} = 1`, true) + row('major axis', `${fmt(2 * A)} (${horiz ? 'horizontal' : 'vertical'})`) + row('minor axis', fmt(2 * B)) +
          row('c = √(A² − B²)', fmt(cc)) + row('foci', `(${fmt(f1[0])}, ${fmt(f1[1])}) & (${fmt(f2[0])}, ${fmt(f2[1])})`) + row('eccentricity e', cc === 0 ? '0 (a circle!)' : fmt(e), cc === 0) +
          row('latus rectum', fmt(2 * B * B / A)) + row('area πab', fmt(Math.PI * a * b));
      } else {
        const cc = Math.sqrt(a * a + b * b), e = cc / a;
        c.strokeStyle = css('--good'); c.lineWidth = 1.5; c.setLineDash([5, 4]);
        for (const sg of [1, -1]) { c.beginPath(); c.moveTo(X(h - 13), Y(k - sg * 13 * b / a)); c.lineTo(X(h + 13), Y(k + sg * 13 * b / a)); c.stroke(); }
        c.setLineDash([]); c.strokeStyle = css('--accent'); c.lineWidth = 3;
        for (const sg of [1, -1]) { c.beginPath(); for (let i = -60; i <= 60; i++) { const t = i / 60 * 2.4, x = h + sg * a * Math.cosh(t), y = k + b * Math.sinh(t); i > -60 ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)); } c.stroke(); }
        dot(h - cc, k, css('--warm'), 'F₁'); dot(h + cc, k, css('--warm'), 'F₂'); dot(h - a, k, css('--accent'), '', true); dot(h + a, k, css('--accent'), '', true);
        out.innerHTML = row('equation', `${sh(h, 'x')}/${fmt(a * a)} − ${sh(k, 'y')}/${fmt(b * b)} = 1`, true) + row('vertices', `(${fmt(h - a)}, ${fmt(k)}) & (${fmt(h + a)}, ${fmt(k)})`) +
          row('c = √(a² + b²)', fmt(cc)) + row('foci', `(${fmt(h - cc)}, ${fmt(k)}) & (${fmt(h + cc)}, ${fmt(k)})`) + row('eccentricity e', fmt(e) + (a === b ? ' (rectangular)' : ''), a === b) +
          row('asymptotes', `y − ${fmt(k)} = ±${fmt(b / a)}(x − ${fmt(h)})`) + row('latus rectum', fmt(2 * b * b / a));
      }
    } else if (type === 'parabola') {
      const o = val('orient'), p = val('p'), h = val('h'), k = val('k');
      if (p === 0) { out.innerHTML = row('Note', 'p cannot be 0'); return; }
      c.strokeStyle = css('--accent'); c.lineWidth = 3; c.beginPath();
      for (let i = -120; i <= 120; i++) { const u = i / 10, x = o === 1 ? h + u : h + u * u / (4 * p), y = o === 1 ? k + u * u / (4 * p) : k + u; i > -120 ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)); } c.stroke();
      const F = o === 1 ? [h, k + p] : [h + p, k];
      c.strokeStyle = css('--good'); c.lineWidth = 2; c.setLineDash([6, 4]); c.beginPath();
      if (o === 1) { c.moveTo(0, Y(k - p)); c.lineTo(W, Y(k - p)); } else { c.moveTo(X(h - p), 0); c.lineTo(X(h - p), H); } c.stroke();
      c.strokeStyle = css('--warm'); c.lineWidth = 1.5; c.beginPath();
      if (o === 1) { c.moveTo(X(h - 2 * p), Y(k + p)); c.lineTo(X(h + 2 * p), Y(k + p)); } else { c.moveTo(X(h + p), Y(k - 2 * p)); c.lineTo(X(h + p), Y(k + 2 * p)); } c.stroke(); c.setLineDash([]);
      dot(h, k, css('--ink'), 'V', true); dot(F[0], F[1], css('--warm'), 'F');
      const sg = (v, n) => v === 0 ? `${n}²` : `(${n} ${v < 0 ? '+' : '−'} ${fmt(Math.abs(v))})²`;
      const lin = (v, n) => v === 0 ? n : `(${n} ${v < 0 ? '+' : '−'} ${fmt(Math.abs(v))})`;
      out.innerHTML = row('equation', o === 1 ? `${sg(h, 'x')} = ${fmt(4 * p)}${lin(k, 'y')}` : `${sg(k, 'y')} = ${fmt(4 * p)}${lin(h, 'x')}`, true) + row('vertex', `(${fmt(h)}, ${fmt(k)})`) + row('focus', `(${fmt(F[0])}, ${fmt(F[1])})`) +
        row('directrix', o === 1 ? `y = ${fmt(k - p)}` : `x = ${fmt(h - p)}`) + row('opens', o === 1 ? (p > 0 ? 'upward' : 'downward') : (p > 0 ? 'to the right' : 'to the left')) + row('latus rectum', fmt(Math.abs(4 * p))) + row('eccentricity', '1');
    } else {
      const v = val('v'), ang = val('ang'), h0 = val('h0'), g = 9.8, al = ang * Math.PI / 180, vx = v * Math.cos(al), vy = v * Math.sin(al);
      const T = (vy + Math.sqrt(vy * vy + 2 * g * h0)) / g, R = vx * T, Hm = h0 + vy * vy / (2 * g), tp = vy / g, vyi = vy - g * T;
      c.strokeStyle = css('--accent'); c.lineWidth = 3; c.beginPath();
      for (let i = 0; i <= 100; i++) { const t = T * i / 100, x = vx * t, y = h0 + vy * t - 0.5 * g * t * t; i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)); } c.stroke();
      dot(0, h0, css('--warm'), 'launch'); dot(vx * tp, Hm, css('--good'), 'top', true); dot(R, 0, css('--good'), 'landing');
      out.innerHTML = row('vₓ = u cos α', fmt(vx) + ' m/s') + row('v_y(0) = u sin α', fmt(vy) + ' m/s') + row('time of flight', fmt(T) + ' s', true) + row('range', fmt(R) + ' m', true) +
        row('greatest height', fmt(Hm) + ' m') + row('time to top', fmt(tp) + ' s') + row('impact speed', fmt(Math.hypot(vx, vyi)) + ' m/s') + row('angle at impact', fmt(Math.atan2(-vyi, vx) * 180 / Math.PI) + '° below horizontal') +
        (h0 === 0 ? row('R = u² sin 2α/g', fmt(v * v * Math.sin(2 * al) / g) + ' m') : '');
    }
  }
  $$('#sl input').forEach(i => i.addEventListener('input', draw)); draw();
}


/* ------------------------------------------------ events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  if (a === 'home') go('home');
  else if (a === 'sec') { go(`week/${route.w}/learn/${d.s}`); window.scrollTo(0, 0); }
  else if (a === 'done') {
    P.sec[secKey(route.w, +d.s)] = true; save();
    if (d.last) { toast('Lessons complete – time to practise!'); go(`week/${route.w}/practice/0`); }
    else { toast('Section complete ✓'); go(`week/${route.w}/learn/${+d.s + 1}`); }
    window.scrollTo(0, 0);
  }
  else if (a === 'copied') { P.notes[d.k] = t.checked; save(); e.stopPropagation(); }
  else if (a === 'step' || a === 'all' || a === 'hide') {
    const [w, s, x] = d.id.split('-').map(Number), n = WK(w).sections[s].ex[x].steps.length;
    rev[d.id] = a === 'hide' ? 0 : a === 'all' ? n + 1 : (rev[d.id] || 0) + 1;
    $('#ex-' + d.id).outerHTML = exHTML(w, s, x);
  }
  else if (a === 'chk') {
    const [w, s, x] = d.id.split('-').map(Number); chk[d.id].sel = +d.j;
    if (chk[d.id].order[+d.j].ok) { P.checks[d.id] = true; save(); }
    $('#chk-' + d.id).outerHTML = checkHTML(w, s, x);
  }
  else if (a === 'print') window.print();
  else if (a === 'preset') { P.ewk = d.w.split(',').map(Number); save(); }
  else if (a === 'reset') {
    if (confirm('Erase all your saved progress on this device?')) {
      P = { sec: {}, quiz: {}, exam: 0, checks: {}, notes: {}, theme: P.theme, pr: {}, pbest: {}, qn: 0, en: 20, ewk: [], erate: 0 }; save();
      Object.keys(rev).forEach(k => delete rev[k]); Object.keys(chk).forEach(k => delete chk[k]); render();
    }
  }
});

/* ------------------------------------------------ theme */
function effTheme() { return P.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function applyTheme() {
  const t = effTheme(); document.documentElement.setAttribute('data-theme', t);
  const b = $('#tt'); b.textContent = t === 'dark' ? '☀' : '☾'; b.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
}
$('#tt').onclick = () => {
  P.theme = effTheme() === 'dark' ? 'light' : 'dark'; save(); applyTheme();
  if (route.v === 'week' && route.tab === 'lab' && WK(route.w).lab) initLab(WK(route.w).lab);
};
applyTheme();
render();
})();
