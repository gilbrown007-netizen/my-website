:root {

  --chm: #0C7468; --chm-bg: #D7F0EB;
  --gen: #A3365A; --gen-bg: #F8E1E9;

    --accent: #7AA2FF; --accent-ink: #0B1220; --accent-bg: #1B2A4A; --today: #15213A;
    --phy: #8DB0FF; --phy-bg: #1B2B4C;
    --mth: #F0A45B; --mth-bg: #3A2915;
    --chm: #5CD0BF; --chm-bg: #10332E;
    --gen: #F08DAB; --gen-bg: #3F1C2B;
    --lec-bg: #212B35; --lec-ink: #9AA7B3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #171F28; --ink: #E5EAF0; --muted: #94A1AE; --line: #2A3540; --grid: rgba(229,234,240,.045);
  --accent: #7AA2FF; --accent-ink: #0B1220; --accent-bg: #1B2A4A; --today: #15213A;
  --phy: #8DB0FF; --phy-bg: #1B2B4C;
  --mth: #F0A45B; --mth-bg: #3A2915;
  --chm: #5CD0BF; --chm-bg: #10332E;
  --gen: #F08DAB; --gen-bg: #3F1C2B;
  --lec-bg: #212B35; --lec-ink: #9AA7B3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font: 15px/1.55 var(--font-body);
}
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phy { --f: var(--phy); --f-bg: var(--phy-bg); }
.mth { --f: var(--mth); --f-bg: var(--mth-bg); }
.chm { --f: var(--chm); --f-bg: var(--chm-bg); }
.gen { --f: var(--gen); --f-bg: var(--gen-bg); }

.hero { padding-block: 26px 16px; }
.eyebrow { font: 500 11.5px/1.4 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font: 800 clamp(30px, 6vw, 46px)/1.05 var(--font-display); margin: 6px 0 4px; text-wrap: balance; letter-spacing: -.01em; }
.sub { margin: 0 0 18px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.label { font: 600 11px/1.3 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.tile input[type="date"] { font: 500 13px var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 100%; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0 2px; }
.big b { font: 600 44px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big span { color: var(--muted); font-size: 14px; }
.tile .when { font: 400 13px var(--font-mono); color: var(--muted); margin: 0 0 12px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
.cov { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

.modebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tablist { display: flex; gap: 2px; overflow-x: auto; }
.tablist button { font: 600 14px var(--font-body); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px 9px; cursor: pointer; white-space: nowrap; }
.tablist button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 20px 48px; display: grid; gap: 20px; }
h2 { font: 600 21px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
h3 { font: 600 13px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head p { margin: 2px 0 0; color: var(--muted); }
ul, ol { margin: 0; padding: 0; list-style: none; }

.chip { display: inline-block; font: 600 12px/1.5 var(--font-mono); padding: 1px 8px; border-radius: 999px; background: var(--f-bg); color: var(--f); white-space: nowrap; }
.time { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }

.blk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.blk label { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 12px 14px; align-items: start; cursor: pointer; }
.blk input[type="checkbox"] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.blk .row1 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.blk .task { display: block; margin-top: 2px; }
.blk.done .task { color: var(--muted); text-decoration: line-through; }
.blk.next { border-color: var(--accent); background: var(--today); }
.tag-now { font: 600 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lec { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; background: var(--lec-bg); color: var(--lec-ink); font-size: 14px; }
.lec .time { color: var(--lec-ink); }
.empty { color: var(--muted); margin: 0; }
.summary-line { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; margin-bottom: 6px; }
.summary-line b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: 500 13px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.scroller { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.wk { --hh: 46px; display: grid; grid-template-columns: 46px repeat(7, minmax(104px, 1fr)); min-width: 820px; }
.hd { padding: 8px 6px; text-align: center; font: 600 12px var(--font-body); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
.hd.today { color: var(--accent); background: var(--today); box-shadow: inset 0 -3px 0 var(--accent); }
.hd small { display: block; font: 400 11px var(--font-mono); color: var(--muted); }
.gut, .col { position: relative; height: calc(15 * var(--hh)); }
.gut span { position: absolute; right: 6px; font: 400 10.5px var(--font-mono); color: var(--muted); }
.col { border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hh) - 1px), var(--line) calc(var(--hh) - 1px), var(--line) var(--hh)); }
.col.today { background-color: var(--today); }
.gb { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 6px; font: 400 11.5px/1.25 var(--font-body); overflow: hidden; text-align: left; margin: 0; }
button.gb { border: 1px solid var(--f); background: var(--f-bg); color: var(--f); cursor: pointer; font-family: var(--font-body); }
button.gb b { font: 600 11.5px var(--font-mono); display: block; }
button.gb.done { opacity: .5; }
button.gb.done b::before { content: "\2713  "; }
.gb.lecture { background: var(--lec-bg); color: var(--lec-ink); }
.gb.lecture b { font: 600 11.5px var(--font-mono); display: block; }
.gb.blocked { background: repeating-linear-gradient(135deg, var(--lec-bg) 0, var(--lec-bg) 5px, var(--line) 5px, var(--line) 6px); color: var(--lec-ink); }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.legend li { display: grid; gap: 2px; }
.legend .meta { font: 400 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.themebar { display: flex; align-items: center; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--ink); font: 500 13px var(--font-body); cursor: pointer; padding: 6px 0; }
.switch .track { width: 42px; height: 24px; border-radius: 999px; background: var(--line); border: 1px solid var(--muted); position: relative; flex: none; transition: background .2s; }
.switch .thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] .track { background: var(--accent); border-color: var(--accent); }

.mt { margin: 4px 0 0; font-size: 14px; }

.wkrow:last-child { border-bottom: 0; }
.wkrow .n { font: 600 14px var(--font-mono); }
.wkrow .d { font: 400 13px var(--font-mono); color: var(--muted); }
.wkrow p { margin: 4px 0 0; }
.wkrow .h { font: 400 12.5px var(--font-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.two ol, .two ul { display: grid; gap: 8px; }
.two li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.two li b { font: 600 13px var(--font-mono); color: var(--accent); }
.two ul li { display: block; }

details.card { padding: 0; }
summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary .ttl { min-width: 0; font-weight: 500; }
summary .cnt { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
summary .bar { grid-column: 1 / -1; }
summary .bar i { background: var(--f); }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 2px 20px; padding: 6px 16px 14px; border-top: 1px solid var(--line); }
.topics li { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; min-width: 0; }
.topics label { display: flex; gap: 8px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
.topics input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--f); flex: none; }
.topics .done span { color: var(--muted); text-decoration: line-through; }
.tagbtn { font: 500 10.5px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; cursor: pointer; flex: none; margin-top: 2px; }
footer { padding-block: 0 8px; }

@media (max-width: 640px) {
  .wkrow { grid-template-columns: 48px 1fr; }
  .wkrow .b { grid-column: 1 / -1; }
  .wkrow .h { grid-column: 1 / -1; text-align: left; }
  .big b { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

    document.getElementById('modeBar').innerHTML = '<span class="label">Workload</span>' +
      [['lite', 'Lighter', LITE], ['full', 'Full', BLOCKS]].map(function (m) {
        return '<button class="btn" data-mode="' + m[0] + '" aria-pressed="' + ((S.mode === 'full') === (m[0] === 'full')) + '">' + m[1] + ' &middot; ' + fmtH(hoursOf(m[2])) + ' a week</button>';
      }).join('');
    document.getElementById('todayLine').textContent = fmtD(new Date(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '. Study blocks sit in the gaps around your lectures.';
  }

  /* Today */
  function renderToday() {
    var now = new Date(), di = (now.getDay() + 6) % 7, key = ymd(now);
    var lec = LECTURES.filter(function (l) { return l.d === di && !l.blocked; });
    var blocks = active().filter(function (b) { return b.d === di; });
    var nowH = now.getHours() + now.getMinutes() / 60;
    var next = null;
    blocks.forEach(function (b) { if (!next && b.e > nowH && !S.done[key + '|' + b.id]) next = b.id; });
    var doneN = blocks.filter(function (b) { return S.done[key + '|' + b.id]; }).length;
    var mon = mondayOf(now), wh = weekHours(mon);
    var out = '<div class="head"><div><h2>' + fmtD(now, { weekday: 'long' }) + '</h2><p>' + doneN + ' of ' + blocks.length + ' study blocks done today</p></div></div>';
    out += '<section><h3>Lectures today</h3>';
    out += lec.length ? lec.map(function (l) {
      return '<div class="lec"><span class="time">' + fmtT(l.s) + '&ndash;' + fmtT(l.e) + '</span><b>' + l.c + '</b><span>' + l.n + (l.w ? ' &middot; ' + l.w : '') + '</span></div>';
    }).join('') : '<p class="empty">No lectures today.</p>';
    out += '</section>' + mthCard(now) + '<section><h3>Study blocks</h3><ul>';
    out += blocks.length ? blocks.map(function (b) {
      var k = key + '|' + b.id, dn = !!S.done[k];
      return '<li class="blk ' + b.f + (dn ? ' done' : '') + (b.id === next ? ' next' : '') + '"><label>' +
        '<input type="checkbox" data-done="' + k + '"' + (dn ? ' checked' : '') + '>' +
        '<span><span class="row1"><span class="time">' + fmtT(b.s) + '&ndash;' + fmtT(b.e) + '</span><span class="chip">' + b.c + '</span>' +
        (b.id === next ? '<span class="tag-now">Up next</span>' : '') + (b.tp ? '<span class="tag-now">' + b.tp + '</span>' : '') + '</span><span class="task">' + b.t + '</span></span></label></li>';
    }).join('') : '<li><p class="empty">Nothing scheduled.</p></li>';
    out += '</ul><p class="note" style="margin-top:8px">17:00 to 19:30 is kept free for travel and personal time.</p></section><section class="card"><div class="summary-line"><span>This week</span><b>' + fmtH(wh) + ' of ' + fmtH(TOTAL_H) + '</b></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, Math.round(wh / TOTAL_H * 100)) + '%"></i></div></section>';
    return out;
  }

  /* Week */
  function renderWeek() {
    var mon = addDays(mondayOf(new Date()), weekOffset * 7), sun = addDays(mon, 6);
    var todayKey = ymd(new Date()), now = new Date(), nowH = now.getHours() + now.getMinutes() / 60;
    var range = fmtD(mon, { day: 'numeric', month: 'short' }) + ' to ' + fmtD(sun, { day: 'numeric', month: 'short', year: 'numeric' });
    var out = '<div class="head"><div><h2>' + range + '</h2><p>Tap a study block to mark it done. White space is free time.</p></div>' +
      '<div class="btns"><button class="btn" data-wk="prev">Previous</button><button class="btn" data-wk="now">This week</button><button class="btn" data-wk="next">Next</button></div></div>';
    out += '<div class="scroller"><div class="wk"><div class="hd"></div>';
    for (var d = 0; d < 7; d++) {
      var dd = addDays(mon, d);
      out += '<div class="hd' + (ymd(dd) === todayKey ? ' today' : '') + '">' + DAYS[d] + '<small>' + dd.getDate() + '</small></div>';
    }
    out += '<div class="gut">';
    for (var h = 7; h < 22; h++) out += '<span style="top:calc(' + (h - 7) + ' * var(--hh) + 2px)">' + pad(h) + ':00</span>';
    out += '</div>';
    for (d = 0; d < 7; d++) {
      var date = addDays(mon, d), key = ymd(date);
      out += '<div class="col' + (key === todayKey ? ' today' : '') + '">';
      out += '<div class="gb lecture blocked" style="top:calc(' + (PERSONAL.s - 7) + ' * var(--hh) + 1px);height:calc(' + (PERSONAL.e - PERSONAL.s) + ' * var(--hh) - 2px)"><b>Personal time</b>17:00&ndash;19:30</div>';
      LECTURES.filter(function (l) { return l.d === d; }).forEach(function (l) {
        out += '<div class="gb lecture' + (l.blocked ? ' blocked' : '') + '" style="top:calc(' + (l.s - 7) + ' * var(--hh) + 1px);height:calc(' + (l.e - l.s) + ' * var(--hh) - 2px)">' +
          '<b>' + l.c + '</b>' + (l.blocked ? '' : (l.w || '')) + '</div>';
      });
      active().filter(function (b) { return b.d === d; }).forEach(function (b) {
        var k = key + '|' + b.id, dn = !!S.done[k];
        out += '<button class="gb ' + b.f + (dn ? ' done' : '') + '" data-done="' + k + '" aria-pressed="' + dn + '" title="' + b.t.replace(/"/g, '&quot;') + '" ' +
          'style="top:calc(' + (b.s - 7) + ' * var(--hh) + 1px);height:calc(' + (b.e - b.s) + ' * var(--hh) - 2px)">' +
          '<b>' + b.c + '</b>' + fmtT(b.s) + '&ndash;' + fmtT(b.e) + '</button>';
      });
      if (key === todayKey && nowH >= 7 && nowH <= 22) out += '<div class="nowline" style="top:calc(' + (nowH - 7) + ' * var(--hh))"></div>';
      out += '</div>';
    }
    out += '</div></div>';
    var cr = { phy: 0, mth: 0, chm: 0, gen: 0 }, hr = { phy: 0, mth: 0, chm: 0, gen: 0 };
    COURSES.forEach(function (c) { cr[c.f] += c.cr; });
    active().forEach(function (b) { hr[b.f] += b.e - b.s; });
    out += '<section class="card"><h3>Weekly hours against credit units (' + fmtH(TOTAL_H) + ' planned)</h3><ul class="legend">';
    ['phy', 'mth', 'chm', 'gen'].forEach(function (f) {
      out += '<li class="' + f + '"><span><span class="chip">' + FAM[f] + '</span></span><span class="meta">' + cr[f] + ' credit units &middot; ' + fmtH(hr[f]) + ' a week</span></li>';
    });
    out += '</ul></section><p class="note">Every lecture is a two-hour slot from your timetable. Friday 13:00 is blocked on the timetable. 17:00 to 19:30 is kept free for travel and personal time, so nothing is planned there. Night sessions run 20:00 to 22:00 and prepare you for the next day\'s first class. Nothing is planned after 22:00, so you can sleep from 22:00 to 05:00. Friday and Saturday nights are free because Saturday and Sunday have no lectures.</p>';
    return out;
  }

  /* Plan */
  function renderPlan() {
    var w = weeks(), now = new Date(), curIdx = Math.floor(diffDays(START, now) / 7);
    var out = '<div class="head"><div><h2>Plan to finals</h2><p>Week numbers follow the semester calendar (week 1 began 5 October), so they match your MTH 101 lecture plan. Phases adjust when you change the exam dates above.</p></div></div><div class="card" style="padding:0"><ol>';
    for (var i = 0; i <= w.wf; i++) {
      var s = addDays(START, i * 7), e = addDays(s, 6), p = phase(i, w);
      var cur = i === curIdx, past = i < curIdx;
      var hrs = past || cur ? fmtH(weekHours(s)) + ' / ' + fmtH(TOTAL_H) : fmtH(TOTAL_H) + ' planned';
      out += '<li class="wkrow ' + p.k + (cur ? ' cur' : '') + (past ? ' past' : '') + '"><span class="n">Wk ' + (i + 2) + '</span>' +
        '<span class="d">' + fmtD(s, { day: 'numeric', month: 'short' }) + ' &ndash; ' + fmtD(e, { day: 'numeric', month: 'short' }) + '</span>' +
        '<div class="b"><span class="ph">' + p.l + '</span>' + (cur ? '<span class="here">This week</span>' : '') + '<p>' + p.t + '</p>' + mthLine(i + 2) + '</div>' +
        '<span class="h">' + (p.k === 'exam' ? '' : hrs) + '</span></li>';
    }
    out += '</ol></div><div class="two"><section class="card"><h3>The routine for every lecture</h3><ol>' +
      '<li><b>1</b><span>Same day: 15-minute recap of your lecture notes.</span></li>' +
      '<li><b>2</b><span>Within 48 hours: problems on that topic.</span></li>' +
      '<li><b>3</b><span>Saturday: redo the questions you got wrong.</span></li>' +
      '<li><b>4</b><span>Sunday: one timed past-question set, then tick the topics you can now do without notes.</span></li>' +
      '<li><b>+</b><span>Chemistry: you get a graded test at the end of every lecture, so read ahead before each CHM 101 lecture and CHM 107 lab, and correct your test mistakes the same day.</span></li></ol></section>' +
      '<section class="card"><h3>From your handbook</h3><ul>' +
      '<li>You need at least 70% attendance to sit an exam.</li>' +
      '<li>Continuous assessment is 30 to 40% of a course and the exam 60 to 70%, so the midsem carries real weight.</li>' +
      '<li>Entirely practical courses are graded 100% on practical work and reports, so lab write-ups are never optional.</li>' +
      '<li>Arrive 15 minutes early with your ID card. No entry after 30 minutes. Grade A starts at 70.</li></ul></section></div>';
    return out;
  }

  /* Topics */
  function renderTopics() {
    var st = topicStats();
    var out = '<div class="head"><div><h2>Topics</h2><p>' + st.ad + ' of ' + st.a + ' covered. Tap MIDSEM or FINALS on a topic to move it once your lecturer confirms what the midsem covers.</p></div>' +
      '<div class="btns">' + [['all', 'All'], ['m', 'Before midsem'], ['f', 'After midsem']].map(function (x) {
        return '<button class="btn" data-filter="' + x[0] + '" aria-pressed="' + (filter === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div></div>';
    COURSES.forEach(function (c) {
      var idx = [];
      c.t.forEach(function (_, i) { if (filter === 'all' || (filter === 'm') === isMid(c, i)) idx.push(i); });
      var done = idx.filter(function (i) { return S.topics[c.c + ':' + i]; }).length;
      var pct = idx.length ? Math.round(done / idx.length * 100) : 0;
      out += '<details class="card ' + c.f + '" data-c="' + c.c + '"' + (openCourse[c.c] ? ' open' : '') + '><summary>' +
        '<span class="chip">' + c.c + '</span><span class="ttl">' + c.n + '</span><span class="cnt">' + done + '/' + idx.length + '</span>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></summary><ul class="topics">';
      idx.forEach(function (i) {
        var id = c.c + ':' + i, dn = !!S.topics[id], m = isMid(c, i);
        out += '<li class="' + (dn ? 'done' : '') + '"><label><input type="checkbox" data-topic="' + id + '"' + (dn ? ' checked' : '') + '><span>' + c.t[i] + '</span></label>' + (c.w ? '<span class="wkt">Wk ' + c.w[i] + '</span>' : '') +
          '<button class="tagbtn" data-tag="' + id + '" title="Move to ' + (m ? 'after' : 'before') + ' midsem">' + (m ? 'Midsem' : 'Finals') + '</button></li>';
      });
      out += idx.length ? '' : '<li><span class="empty">No topics in this view.</span></li>';
      out += '</ul></details>';
    });
    return out;
  }

  /* Render */
  function render() {
    applyTheme();
    var a = document.activeElement, sel = null;
    if (a && a.dataset) {
      ['done', 'topic', 'tag', 'tab', 'wk', 'filter', 'mode'].some(function (k) {
        if (a.dataset[k] !== undefined) { sel = '[data-' + k + '="' + a.dataset[k] + '"]'; return true; }
        return false;
      });
    }
    TOTAL_H = hoursOf(active());
    renderTiles();
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    view.innerHTML = tab === 'today' ? renderToday() : tab === 'week' ? renderWeek() : tab === 'plan' ? renderPlan() : renderTopics();
    if (sel) { var el = document.querySelector(sel); if (el) el.focus({ preventScroll: true }); }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-wk],[data-filter],[data-mode],[data-tag],button[data-done]');
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; }
    else if (t.dataset.wk) { weekOffset = t.dataset.wk === 'now' ? 0 : weekOffset + (t.dataset.wk === 'next' ? 1 : -1); }
    else if (t.dataset.mode) { S.mode = t.dataset.mode === 'full' ? 'full' : 'lite'; }
    else if (t.dataset.filter) { filter = t.dataset.filter; }
    else if (t.dataset.tag) {
      var p = t.dataset.tag.split(':'), c = COURSES.filter(function (x) { return x.c === p[0]; })[0];
      S.tags[t.dataset.tag] = isMid(c, +p[1]) ? 'f' : 'm'; save();
    } else if (t.dataset.done) {
      if (S.done[t.dataset.done]) delete S.done[t.dataset.done]; else S.done[t.dataset.done] = true;
    }
    save();
    render();
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if ((t.id === 'midDate' || t.id === 'finDate') && DATE_RE.test(t.value)) {
      if (t.id === 'midDate') S.mid = t.value; else S.fin = t.value;
      save();
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-done]')) { if (t.checked) S.done[t.dataset.done] = true; else delete S.done[t.dataset.done]; save(); render(); }
    else if (t.matches('input[data-topic]')) { if (t.checked) S.topics[t.dataset.topic] = true; else delete S.topics[t.dataset.topic]; save(); render(); }
    else if ((t.id === 'midDate' || t.id === 'finDate') && t.value) {
      if (t.id === 'midDate') S.mid = t.value; else S.fin = t.value;
      if (parse(S.fin) <= parse(S.mid)) { if (t.id === 'midDate') S.fin = ymd(addDays(parse(S.mid), 28)); else S.mid = ymd(addDays(parse(S.fin), -28)); }
      save(); render();
    }
  });
  view.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d.matches && d.matches('details[data-c]')) { openCourse[d.dataset.c] = d.open; save(); }
  }, true);

  /* Save when the page is hidden or closed, re-read when it comes back or another tab saves */
  document.getElementById('themeSwitch').addEventListener('click', function () {
    S.theme = isDark() ? 'light' : 'dark';
    applyTheme(); save();
  });
  document.getElementById('themeReset').addEventListener('click', function () {
    S.theme = 'system';
    applyTheme(); save();
  });
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onMq = function () { if (S.theme === 'system') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  } catch (e) { /* no media query support: the switch still works */ }
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); else sync(); });
  window.addEventListener('pagehide', save);
  window.addEventListener('beforeunload', save);
  window.addEventListener('blur', save);
  window.addEventListener('focus', sync);
  window.addEventListener('pageshow', sync);
  window.addEventListener('storage', function (e) { if (e.key === KEY) sync(); });
  setInterval(save, 30000);

  load(true);
  render();
  save();
})();
</script>

</body></html>
